<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>CITY BOMBER — Bus Adventures</title>
<style>
  :root{--case:#141a21;--case-hi:#26313d;--key:#1f2a33;--key-lip:#0b1015;--key-on:#2f4050;--alarm:#c8412f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070b0f;font-family:"Helvetica Neue",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  #device{width:100%;max-width:520px;background:var(--case);display:flex;flex-direction:column;border-radius:18px;padding:10px 10px 14px;margin:6px 0;border-top:1px solid var(--case-hi);box-shadow:0 18px 44px rgba(0,0,0,.7)}
  #brand{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:#5f7383;font-size:10px;letter-spacing:.2em}
  #brand b{color:#b6cbd9;font-size:12px;letter-spacing:.3em;flex:1;text-align:left}
  #btnHjem{padding:5px 9px;border-radius:7px;background:#1b242c;border:0;border-bottom:2px solid var(--key-lip);line-height:0;margin-right:2px}
  #btnHjem svg{width:13px;height:13px;fill:#6d8291}
  #alarm{width:8px;height:8px;border-radius:50%;background:#1f2a33;margin:0 6px}
  #alarm.lit{background:var(--alarm);box-shadow:0 0 9px var(--alarm)}
  #btnMeny{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.14em;border-radius:7px;background:#1b242c;color:#6d8291;border:0;border-bottom:2px solid var(--key-lip)}
  #screen{position:relative;background:#060a0e;border-radius:6px;padding:5px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.6);min-height:220px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:3px;background:#000}
  #pad{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:12px}
  #pad button{position:relative;overflow:hidden;background:var(--key);border:0;border-radius:16px;padding:0;height:76px;border-bottom:4px solid var(--key-lip);display:flex;align-items:center;justify-content:center;gap:6px;color:#8aa3b5;font-size:10px;font-weight:700;letter-spacing:.14em;touch-action:manipulation}
  #pad button:active,#pad button.ned{background:var(--key-on);border-bottom-width:2px;transform:translateY(2px);color:#e2f1fa}
  .cdbar{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(232,193,92,.34);pointer-events:none}
  #left{opacity:.38;color:#4a5d6a}
  #left.armed{opacity:1;color:#e8c15c}
  #right{opacity:.38;color:#4a5d6a}
  #right.armed{opacity:1;color:#e8c15c}
  #special{opacity:.38;color:#4a5d6a}
  #special.armed{opacity:1;color:#e8c15c}
  #meny{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;border-radius:4px;background:rgba(4,8,12,.92);z-index:5}
  #meny.vis{display:flex}
  #menyKort{width:min(300px,92%);text-align:center;padding:4px}
  #menyKort h1{margin:0;font-size:15px;letter-spacing:.26em;color:#7CFF7C}
  #menyKort .under{margin:4px 0 12px;font-size:11px;letter-spacing:.16em;color:#6d8291}
  #menyResultat{margin:0 0 12px;display:none}
  #menyResultat.vis{display:block}
  #menyResultat .tittel{font-size:12px;color:#c8412f;letter-spacing:.14em;font-weight:700}
  #menyResultat .tall,#menyResultat .poeng,#menyResultat .rekord{font-size:12px;color:#7fd4c8;margin-top:4px;font-family:"Courier New",monospace;font-weight:700}
  .valg{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-bottom:8px;padding:13px 16px;border-radius:11px;background:#1f2a33;border:0;border-bottom:3px solid var(--key-lip)}
  .valg b{font-size:13px;letter-spacing:.14em;color:#dceaf3}
  .valg span{font-size:10px;color:#6d8291}
  .hint{font-size:10px;color:#5f7383;line-height:1.6;margin-top:10px}
  #btnTilbake{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-top:6px;padding:13px 16px;border-radius:11px;background:#162028;border:0;border-bottom:3px solid var(--key-lip)}
  #btnTilbake b{font-size:13px;letter-spacing:.14em;color:#8aa3b5}
  #btnTilbake span{font-size:10px;color:#6d8291}
  #err{display:none;position:absolute;left:6px;right:6px;top:6px;z-index:20;padding:8px;background:#3a1414;color:#ffb3a7;font:11px/1.4 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="device">
  <div id="brand">
    <button id="btnHjem" type="button" aria-label="Back to Bus Adventures"><svg viewBox="0 0 24 24"><path fill="#6d8291" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <b>CITY BOMBER</b>
    <span id="alarm"></span>
    <button id="btnMeny" type="button">MENU</button>
  </div>
  <div id="screen">
    <canvas id="cv" width="640" height="520"></canvas>
    <div id="meny" class="vis">
      <div id="menyKort">
        <h1>CITY BOMBER</h1>
        <div class="under">Choose game · v8</div>
        <div id="menyResultat">
          <div class="tittel" id="menyTittel">GAME OVER</div>
          <div class="tall" id="menyTall"></div>
          <div class="poeng" id="menyPoeng"></div>
          <div class="rekord" id="menyRekord"></div>
        </div>
        <button class="valg" data-mode="A"><b>GAME A</b><span>Slow pass.</span></button>
        <button class="valg" data-mode="B"><b>GAME B</b><span>Fast city.</span></button>
        <button class="valg" data-mode="C"><b>GAME C</b><span>Flak towers.</span></button>
        <p class="hint">Plane flies left to right. End of a pass: one row down.<br>
        Drop bombs. Flatten the city before you hit a roof.<br>
        FLARE shoots down incoming flak. Towers stay.</p>
        <button type="button" id="btnTilbake"><b>BACK</b><span>Bus Adventures</span></button>
      </div>
    </div>
    <div id="err"></div>
  </div>
  <div id="pad">
    <button id="left" type="button">GUN<div class="cdbar" id="cdGun"></div></button>
    <button id="special" type="button">BOMB<div class="cdbar" id="cdBomb"></div></button>
    <button id="right" type="button">FLARE<div class="cdbar" id="cdFlare"></div></button>
  </div>
</div>
<script>
const HJEM = '../../index.html';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const meny = document.getElementById('meny'), menyResultat = document.getElementById('menyResultat');
const alarmLed = document.getElementById('alarm'), errBox = document.getElementById('err');
const W = 320, H = 260;
const COLS = 14, BW = 20, BH = 11, CITY_X = 20, GROUND = 236, START_Y = 28, STEP_Y = 14;
const NIVA = {
  A: {speed: 62, bomb: 150, extra: 0},
  B: {speed: 84, bomb: 175, extra: 1},
  C: {speed: 102, bomb: 200, extra: 3}
};
let S = null, crashed = false;

function beste(mode){
  try { return +localStorage.getItem('ba_city_'+mode) || 0; } catch(e){ return 0; }
}
function lagre(mode, score){
  try {
    const hi = beste(mode);
    if (score > hi){ localStorage.setItem('ba_city_'+mode, String(score)); return true; }
  } catch(e){}
  return false;
}
function buzz(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

function buildCity(wave, extra){
  const maxH = Math.min(14, 5 + wave + extra);
  const minH = Math.min(6, 2 + Math.floor(wave/2) + Math.max(0, extra-1));
  const cols = [];
  const span = Math.max(1, maxH-minH+1);
  for (let i=0;i<COLS;i++){
    cols.push(minH + ((i*7 + wave*3) % span));
  }
  if (extra < 2){
    cols[0] = Math.max(2, cols[0]-1);
    cols[COLS-1] = Math.max(2, cols[COLS-1]-1);
  }
  return cols;
}

function reset(mode){
  const n = NIVA[mode];
  S = {
    mode, wave:1, score:0, lives:3,
    cols: buildCity(1, n.extra),
    deadGun: new Array(COLS).fill(false),
    px: -28, py: START_Y, pass:0,
    bomb: null, flak: [], fx: [], smoke: [], dark: new Array(COLS).fill(0),
    fireWait: 900, exhaust: 0, flare: 0, flareCD: 0, strikes: [],
    shots: [], gunLeft: 2, gunCD: 0,
    over:false, paused:false, last:0, menyPlanlagt:false,
    flash:0, shake:0, clearWait:0, dying:0, invuln:0, fallVy:0, nyRekord:false, arsak:''
  };
  meny.classList.remove('vis');
}

function colX(i){ return CITY_X + i*BW; }
function roofY(i){ return GROUND - S.cols[i]*BH; }
function cityLeft(){ return S.cols.reduce((a,h)=>a+h,0); }
function maxRoof(){
  let y = GROUND;
  for (let i=0;i<COLS;i++) if (S.cols[i]>0) y = Math.min(y, roofY(i));
  return y;
}
function isLow(){
  return S.py + 12 + STEP_Y*2 >= maxRoof();
}
function onLastLine(){
  return S.py + 10 + STEP_Y >= maxRoof();
}
function gunReady(){
  return S && S.mode!=='A' && !S.over && onLastLine() && S.gunLeft>0 && S.gunCD<=0;
}
function isGun(i){
  return S.mode==='C' && !S.deadGun[i] && S.cols[i] >= 3 && (i%3===1 || i%4===2);
}

function burst(x, y, n, kind){
  if (S.fx.length > 90) S.fx.splice(0, S.fx.length-70);
  for (let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2;
    const sp = kind==='crash' ? 40+Math.random()*80 : kind==='dust' ? 10+Math.random()*24 : 16+Math.random()*46;
    S.fx.push({
      x, y,
      vx: Math.cos(a)*sp*(kind==='up' ? 0.4 : 1),
      vy: kind==='up' ? (-20-Math.random()*40) : Math.sin(a)*sp - (kind==='crash'?20:8),
      t: kind==='crash' ? 520+Math.random()*200 : kind==='spark' ? 180+Math.random()*120 : 280+Math.random()*180,
      kind,
      s: kind==='smoke' ? 3+Math.random()*3 : kind==='dust' ? 2 : 1+Math.random()*2
    });
  }
}

function dropBomb(){
  if (!S || S.over || S.paused || S.bomb || S.clearWait>0) return;
  S.bomb = {x: S.px + 22, y: S.py + 8};
  burst(S.bomb.x, S.bomb.y, 4, 'spark');
  buzz(8);
}

function fireGun(){
  if (!gunReady() || S.paused || S.clearWait>0) return;
  S.shots.push({x: S.px+34, y: S.py+6});
  S.gunLeft--;
  S.gunCD = 520;
  burst(S.px+34, S.py+6, 5, 'spark');
  buzz(10);
}

function fireFlare(){
  if (!S || S.over || S.paused || S.flareCD>0 || S.clearWait>0) return;
  if (S.mode!=='C') return;
  S.flare = 700;
  S.flareCD = 3200;
  S.strikes = [];
  const ox = S.px+28, oy = S.py+6;
  for (const f of S.flak){
    S.strikes.push({x:ox, y:oy, tx:f.x, ty:f.y, kind:'flak', ref:f, t:0});
  }
  if (!S.strikes.length){
    burst(ox, oy+8, 8, 'spark');
  } else {
    burst(ox, oy, 10, 'spark');
  }
  buzz(20);
}

function resolveStrike(st){
  burst(st.tx, st.ty, 10, 'spark');
  burst(st.tx, st.ty, 6, 'up');
  if (st.kind==='flak'){
    S.flak = S.flak.filter(f => f !== st.ref);
  }
}

function hitCol(i){
  if (i<0 || i>=COLS || S.cols[i]<=0) return false;
  S.cols[i]--;
  S.score += 10 + S.wave*2;
  S.dark[i] = 900;
  const x = colX(i)+BW/2, y = roofY(i)+BH;
  burst(x, y, 14, 'up');
  burst(x, y, 8, 'spark');
  burst(x, y+2, 6, 'dust');
  S.smoke.push({i, t: 1600, x, y});
  S.flash = 5;
  buzz(14);
  return true;
}

function planeHit(){
  for (let i=0;i<COLS;i++){
    if (S.cols[i]<=0) continue;
    const x=colX(i), y=roofY(i);
    if (S.px+32 > x+2 && S.px+2 < x+BW-2 && S.py+11 > y && S.py < GROUND) return true;
  }
  return false;
}

function nextWave(){
  S.wave++;
  S.cols = buildCity(S.wave, NIVA[S.mode].extra);
  S.px = -28; S.py = START_Y; S.pass = 0; S.bomb = null; S.flak = [];
  S.clearWait = 0; S.smoke = []; S.dark = new Array(COLS).fill(0); S.deadGun = new Array(COLS).fill(false); S.fireWait = 700;
  S.flare = 0; S.flareCD = 0; S.strikes = []; S.shots = []; S.gunLeft = 2; S.gunCD = 0;
  S.score += 100 * S.wave;
}

function crash(why){
  if (S.dying>0 || S.over) return;
  S.arsak = why;
  S.lives--;
  S.dying = S.lives<=0 ? 1700 : 950;
  S.fallVy = 30;
  S.flash = 14; S.shake = 9;
  S.bomb = null; S.flak = []; S.shots = []; S.strikes = [];
  burst(S.px+16, S.py+6, 18, 'crash');
  burst(S.px+16, S.py+6, 10, 'spark');
  burst(S.px+16, S.py+6, 8, 'smoke');
  buzz(S.lives<=0 ? 55 : 30);
}

function finishCrash(){
  if (S.lives<=0){
    S.over = true;
    S.nyRekord = lagre(S.mode, S.score);
    return;
  }
  S.dying = 0;
  S.px = -28;
  S.py = START_Y;
  S.fallVy = 0;
  S.bomb = null; S.flak = []; S.shots = []; S.strikes = [];
  S.invuln = 900;
}

function update(dt){
  const t = dt/1000;
  const n = NIVA[S.mode];
  const spd = n.speed + (S.wave-1)*10 + S.pass*2;

  if (S.flash>0) S.flash--;
  if (S.shake>0){ S.shake *= 0.82; if (S.shake<0.2) S.shake=0; }
  for (const f of S.fx){
    f.t-=dt; f.x+=f.vx*t; f.y+=f.vy*t;
    f.vy += (f.kind==='smoke'?18: f.kind==='spark'?40:80)*t;
    f.vx *= 0.99;
  }
  S.fx = S.fx.filter(f=>f.t>0);
  S.exhaust = (S.exhaust||0) - dt;
  if (!S.over && S.dying<=0 && S.exhaust<=0){
    S.fx.push({x:S.px-2, y:S.py+6, vx:-10-Math.random()*8, vy:(Math.random()-0.5)*6, t:240, kind:'smoke', s:2});
    S.exhaust = 55;
  }
  if (S.flare>0) S.flare -= dt;
  if (S.flareCD>0) S.flareCD -= dt;
  if (S.gunCD>0) S.gunCD -= dt;
  for (const st of S.strikes){
    st.t += dt;
    const u = Math.min(1, st.t/220);
    st.x = st.x + (st.tx - st.x) * Math.min(1, 10*t);
    st.y = st.y + (st.ty - st.y) * Math.min(1, 10*t);
    if (u>=1 || (Math.abs(st.x-st.tx)<4 && Math.abs(st.y-st.ty)<4)){
      resolveStrike(st);
      st.done = true;
    }
  }
  S.strikes = S.strikes.filter(st => !st.done);

  for (const sh of S.shots){
    sh.x += 280 * t;
    for (let i=0;i<COLS;i++){
      if (S.cols[i]<=0) continue;
      const gx = colX(i), gy = roofY(i);
      const tower = isGun(i) && sh.y+4 > gy-10 && sh.y < gy+10;
      const wall = sh.y+3 >= gy && sh.y <= GROUND;
      if (sh.x > gx && sh.x < gx+BW && (tower || wall)){
        hitCol(i);
        burst(gx+BW/2, gy, 8, 'spark');
        sh.dead = true;
        break;
      }
    }
  }
  S.shots = S.shots.filter(sh => !sh.dead && sh.x < W+10);
  for (const s of S.smoke){ s.t-=dt; s.y -= 8*t; }
  S.smoke = S.smoke.filter(s=>s.t>0);
  for (let i=0;i<COLS;i++) if (S.dark[i]>0) S.dark[i]-=dt;

  if (S.dying>0){
    S.dying -= dt;
    S.fallVy = (S.fallVy||30) + 220*t;
    S.py += S.fallVy * t;
    S.px += 28 * t;
    if (S.py > GROUND-8){ S.py = GROUND-8; S.fallVy *= -0.25; }
    if ((S.dying|0)%90 < 20) burst(S.px+16, S.py+4, 2, 'crash');
    if (S.dying<=0) finishCrash();
    return;
  }
  if (S.over) return;
  if (S.invuln>0) S.invuln -= dt;

  if (S.clearWait>0){
    S.clearWait -= dt;
    if (S.clearWait<=0) nextWave();
    return;
  }

  S.px += spd * t;
  if (S.px > W + 8){
    S.px = -28;
    S.py += STEP_Y;
    S.pass++;
    if (S.py > GROUND-8){ crash('GROUND'); return; }
  }

  if (S.bomb){
    S.bomb.y += n.bomb * t;
    const i = Math.floor((S.bomb.x - CITY_X) / BW);
    if (i>=0 && i<COLS && S.cols[i]>0 && S.bomb.y >= roofY(i)){
      hitCol(i);
      S.bomb = null;
    } else if (S.bomb.y >= GROUND){
      burst(S.bomb.x, GROUND-1, 8, 'dust');
      S.bomb = null;
    }
  }

  S.fireWait -= dt;
  if (S.fireWait <= 0){
    const guns = [];
    for (let i=0;i<COLS;i++) if (isGun(i)) guns.push(i);
    if (guns.length){
      const i = guns[(S.pass + S.wave) % guns.length];
      S.flak.push({x: colX(i)+BW/2, y: roofY(i)-2, vy: -78 - S.wave*6});
      burst(colX(i)+BW/2, roofY(i)-2, 4, 'spark');
    }
    S.fireWait = Math.max(420, 1100 - S.wave*80 - (S.mode==='C'?200:0));
  }
  for (const f of S.flak){
    f.y += f.vy * t;
    if (!S.over && S.dying<=0 && S.invuln<=0 && S.flare<=0 && f.x > S.px+2 && f.x < S.px+34 && f.y > S.py-2 && f.y < S.py+12){
      crash('FLAK'); return;
    }
  }
  S.flak = S.flak.filter(f => f.y > -8);

  if (cityLeft()===0){
    S.clearWait = 700;
    S.flash = 8;
    buzz(30);
    return;
  }
  if (S.invuln<=0 && planeHit()) crash('ROOF');
}

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

function spr(x, y, rows, w, color, s){
  ctx.fillStyle = color;
  for (let r=0;r<rows.length;r++){
    let bits = rows[r];
    for (let c=w-1;c>=0;c--){
      if (bits & 1) ctx.fillRect(x+c*s, y+r*s, s, s);
      bits >>= 1;
    }
  }
}

const SP = {
  plane: [
    0b00000001111000000000,
    0b00000011111100000000,
    0b00011111111111100000,
    0b01111111111111111000,
    0b11111111111111111110,
    0b01111111111111111111,
    0b00011111111111111100,
    0b00000111000111000000,
    0b00001111001111000000,
    0b00000110000110000000
  ],
  planeHi: [
    0b00000000110000000000,
    0b00000001111000000000,
    0b00000011100000000000,
    0b00000000000000111000,
    0b00000000000000000110,
    0b00000000000000000001,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000
  ],
  cock: [
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000001100000000,
    0b00000000011110000000,
    0b00000000001100000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000
  ],
  star: [
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000100000000000000,
    0b00001110000000000000,
    0b00000100000000000000,
    0b00000000000000000000,
    0b00000000000000000000,
    0b00000000000000000000
  ],
  bomb: [0b010, 0b111, 0b111, 0b010, 0b010, 0b111],
  bombFin: [0b000, 0b000, 0b000, 0b101, 0b000, 0b000],
  gun: [0b00100, 0b00100, 0b01110, 0b11111]
};

function drawPlane(x,y){
  if (S.invuln>0 && !S.dying && ((S.invuln/80)|0)%2===0) return;
  if (S.dying>0){
    y += ((S.dying/40)|0)%2;
    x += ((S.dying/55)|0)%3 - 1;
  }
  const g='#7CFF7C', l='#c8ffc8', d='#2a6a38', k='#0b140d';
  px(x+2, y+5, 28, 3, g);
  px(x+4, y+4, 22, 5, g);
  px(x+24, y+5, 8, 3, g);
  px(x+30, y+6, 4, 2, l);
  px(x, y+2, 3, 6, g);
  px(x+1, y, 2, 3, g);
  px(x+18, y+2, 6, 3, g);
  px(x+19, y+1, 4, 2, k);
  px(x+8, y+8, 16, 2, g);
  px(x+10, y+10, 5, 2, d);
  px(x+18, y+10, 5, 2, d);
  px(x+12, y+6, 2, 2, '#e8c15c');
  const spin = ((S.px/2)|0)%2;
  px(x+32, y+4, 2, spin?6:2, l);
  px(x+32, y+(spin?4:6), spin?2:6, 2, l);
  if (S.flare>0){
    px(x+8, y+12, 4, 3, '#e8c15c');
    px(x+6, y+14, 8, 4, '#fff3a0');
    px(x+10, y+16, 5, 5, '#c8412f');
  }
}

function drawBomb(b){
  spr(Math.round(b.x)-3, Math.round(b.y), SP.bomb, 3, '#e8c15c', 2);
  spr(Math.round(b.x)-3, Math.round(b.y), SP.bombFin, 3, '#7CFF7C', 2);
  px(Math.round(b.x), Math.round(b.y)-4, 1, 3, '#5ad46a');
}

function drawMoon(){
  spr(W-42, 16, [
    0b00111100,
    0b01111110,
    0b11111111,
    0b11111111,
    0b11111111,
    0b11111111,
    0b01111110,
    0b00111100
  ], 8, '#3a5a40', 2);
  spr(W-40, 18, [
    0b00111000,
    0b01111100,
    0b01111100,
    0b00111000
  ], 8, '#7CFF7C', 2);
}

function drawFarCity(){
  ctx.fillStyle='#0d1a12';
  const base = GROUND-18;
  for (let i=0;i<22;i++){
    const h = 8 + ((i*5+S.wave)%14);
    ctx.fillRect(i*16, base-h, 14, h);
  }
}

function drawCity(){
  drawFarCity();
  px(0, GROUND, W, H-GROUND, '#102018');
  px(0, GROUND, W, 2, '#7CFF7C');
  for (let i=0;i<W;i+=8) px(i, GROUND+6, 4, 1, '#2a4a32');
  for (let i=0;i<COLS;i++){
    const h = S.cols[i];
    if (!h) continue;
    const x = colX(i);
    const wall = i%3===0 ? '#4cbc62' : i%3===1 ? '#7CFF7C' : '#5ad46a';
    const roof = i%2 ? '#c8ffc8' : '#e8c15c';
    for (let k=0;k<h;k++){
      const y = GROUND - (k+1)*BH;
      px(x+1, y+1, BW-2, BH-1, wall);
      px(x, y+1, 1, BH-1, '#2a6a38');
      px(x+BW-1, y+1, 1, BH-1, '#2a6a38');
      if (k === h-1){
        px(x, y, BW, 2, roof);
        px(x+2, y-2, BW-4, 2, roof);
        px(x+4, y-3, BW-8, 1, roof);
        if (isGun(i)){
          spr(x+5, y-8, SP.gun, 5, '#e8c15c', 2);
        } else {
          if (i%4===2){ px(x+BW/2-1, y-7, 1, 4, '#c8ffc8'); px(x+BW/2-2, y-8, 3, 1, '#e8c15c'); }
          if (i%5===1) px(x+3, y-5, 2, 3, '#5ad46a');
        }
      }
      if (k>0){
        const black = S.dark[i] > 0;
        const a = !black && ((i*3+k+S.wave)%5)!==0;
        const b = !black && ((i+k+S.pass)%3)===0;
        px(x+4, y+4, 4, 3, a ? '#e8c15c' : '#0b140d');
        px(x+11, y+4, 4, 3, b ? '#e8c15c' : '#0b140d');
        if (a) px(x+5, y+5, 2, 1, '#fff3a0');
      } else {
        px(x+7, y+3, 6, BH-4, '#0b140d');
        px(x+9, y+5, 2, BH-6, '#1a2a1c');
      }
    }
  }
}

function drawSmoke(){
  for (const s of S.smoke){
    const a = Math.max(0.15, s.t/1400);
    const n = 5;
    for (let k=0;k<n;k++){
      const ox = ((k*7+((s.t/80)|0))%7)-3;
      const oy = -k*4;
      ctx.fillStyle = k%2 ? 'rgba(200,255,200,'+(a*0.45)+')' : 'rgba(90,140,80,'+(a*0.55)+')';
      ctx.fillRect(s.x+ox-2, s.y+oy, 4+k%2, 3);
    }
  }
}

function drawHud(){
  ctx.fillStyle='#7CFF7C';
  ctx.font='10px monospace';
  ctx.fillText(String(S.score).padStart(5,'0'), 8, 12);
  ctx.fillText('CITY '+S.wave, 80, 12);
  ctx.fillText('PASS '+S.pass, 150, 12);
  for (let i=0;i<S.lives;i++) px(W-14-i*12, 6, 8, 3, '#7CFF7C');
  if (S.mode!=='A'){
    ctx.fillText('GUN '+S.gunLeft, 210, 12);
  }
  if (S.mode==='C'){
    if (S.flareCD<=0 && !S.over) ctx.fillText('FLARE', 258, 12);
    else { ctx.fillStyle='#2a4a32'; ctx.fillText('FLARE', 258, 12); ctx.fillStyle='#7CFF7C'; }
  }
  if (isLow() && !S.over && ((Date.now()/220)|0)%2){
    ctx.fillStyle='#c8412f';
    ctx.fillText('LOW', W-36, 12);
  }
}

function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if (!S){
    ctx.fillStyle='#1a2a1c';
    for (let i=0;i<18;i++) ctx.fillRect((i*37)%W, 20+(i*13)%80, 1, 1);
    return;
  }
  ctx.save();
  if (S.shake) ctx.translate((Math.random()-0.5)*S.shake, (Math.random()-0.5)*S.shake);
  ctx.fillStyle='#142018';
  for (let i=0;i<24;i++) ctx.fillRect((i*53+S.pass*3)%W, 16+(i*17)%90, 1, 1);
  drawMoon();
  drawCity();
  drawSmoke();
  if (S.bomb) drawBomb(S.bomb);
  for (const sh of S.shots){
    px(sh.x, sh.y, 6, 2, '#fff3a0');
    px(sh.x+6, sh.y, 3, 2, '#e8c15c');
  }
  for (const f of S.flak){
    px(f.x-1, f.y, 3, 4, '#e8c15c');
    px(f.x, f.y-2, 1, 3, '#c8ffc8');
  }
  ctx.save();
  ctx.lineCap='round';
  for (const st of S.strikes){
    ctx.strokeStyle='rgba(232,193,92,0.85)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(S.px+28, S.py+6);
    ctx.lineTo(st.x, st.y);
    ctx.stroke();
    px(st.x-1, st.y-1, 3, 3, '#fff3a0');
  }
  ctx.restore();
  drawPlane(Math.round(S.px), Math.round(S.py));
  for (const f of S.fx){
    const life = Math.max(0, Math.min(1, f.t/300));
    const k = f.kind||'spark';
    if (k==='smoke') ctx.fillStyle = 'rgba(90,140,100,'+(0.15+life*0.35)+')';
    else if (k==='dust') ctx.fillStyle = 'rgba(90,160,80,'+(0.2+life*0.4)+')';
    else if (k==='crash') ctx.fillStyle = life>0.5 ? '#e8c15c' : '#c8412f';
    else if (k==='up') ctx.fillStyle = life>0.45 ? '#e8c15c' : '#7CFF7C';
    else ctx.fillStyle = life>0.4 ? '#fff3a0' : '#e8c15c';
    const s = Math.max(1, f.s||2);
    ctx.fillRect(f.x, f.y, s, s);
  }
  if (S.flash>0){
    ctx.fillStyle='rgba(255,200,80,'+(S.flash/14)+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  drawHud();
  alarmLed.classList.toggle('lit', !!(S && (S.over || S.flash>0 || isLow())));
  const bombOk = !!(S && !S.over && !S.dying && !S.bomb && S.clearWait<=0);
  document.getElementById('special').classList.toggle('armed', bombOk);
  document.getElementById('right').classList.toggle('armed', !!(S && S.mode==='C' && S.flareCD<=0 && !S.over && !S.dying));
  document.getElementById('left').classList.toggle('armed', !!gunReady());
  const niva = S ? NIVA[S.mode] : null;
  let bombP = 0;
  if (S && S.bomb && niva){
    bombP = Math.max(0, Math.min(1, (GROUND - S.bomb.y) / (GROUND - START_Y)));
  }
  document.getElementById('cdBomb').style.height = bombP ? (bombP*100)+'%' : '0';
  document.getElementById('cdFlare').style.height = (S && S.flareCD>0) ? ((S.flareCD/3200)*100)+'%' : '0';
  document.getElementById('cdGun').style.height = (S && S.gunCD>0) ? ((S.gunCD/520)*100)+'%' : '0';
}

function planleggMeny(){
  if (!S || S.menyPlanlagt || S.dying>0) return;
  S.menyPlanlagt = true;
  document.getElementById('menyTittel').textContent =
    S.arsak==='GROUND' ? 'TOO LOW' : S.arsak==='FLAK' ? 'FLAK' : 'HIT ROOF';
  document.getElementById('menyTall').textContent = 'CITY '+S.wave+'  PASS '+S.pass;
  document.getElementById('menyPoeng').textContent = 'SCORE '+String(S.score).padStart(4,'0');
  document.getElementById('menyRekord').textContent = S.nyRekord ? 'NEW HI '+S.score : 'HI '+beste(S.mode);
  menyResultat.classList.add('vis');
  meny.classList.add('vis');
}

function frame(t){
  if (crashed) return;
  try {
    if (!S){ draw(); requestAnimationFrame(frame); return; }
    if (!S.last) S.last = t;
    let dt = t - S.last; S.last = t;
    if (dt>250) dt=16.7; else if (dt>66) dt=66;
    if (!S.paused) update(dt);
    if (S.over) planleggMeny();
    draw();
  } catch(e){
    crashed = true;
    errBox.style.display='block';
    errBox.textContent = String(e && e.stack ? e.stack : e);
  }
  requestAnimationFrame(frame);
}

function layout(){
  const screen = document.getElementById('screen');
  const r = screen.getBoundingClientRect();
  const maxW = Math.max(160, r.width-4), maxH = Math.max(140, r.height-4);
  const s = Math.min(maxW/W, maxH/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
window.addEventListener('resize', layout);

document.getElementById('left').addEventListener('pointerdown', ev => { ev.preventDefault(); fireGun(); });
document.getElementById('special').addEventListener('pointerdown', ev => { ev.preventDefault(); dropBomb(); });
document.getElementById('right').addEventListener('pointerdown', ev => { ev.preventDefault(); fireFlare(); });
document.getElementById('btnMeny').addEventListener('click', () => {
  if (!S || S.over){ meny.classList.add('vis'); return; }
  S.paused = !S.paused;
  meny.classList.toggle('vis', S.paused);
});
function goHjem(){ window.location.href = HJEM; }
document.getElementById('btnHjem').addEventListener('click', goHjem);
document.getElementById('btnTilbake').addEventListener('click', goHjem);
document.querySelectorAll('.valg').forEach(btn => btn.addEventListener('click', () => {
  reset(btn.getAttribute('data-mode'));
  menyResultat.classList.remove('vis');
}));
window.addEventListener('keydown', e => {
  if (e.key===' ' || e.key==='Enter' || e.key==='ArrowDown'){ e.preventDefault(); dropBomb(); }
  if (e.key==='f' || e.key==='F' || e.key==='ArrowUp'){ e.preventDefault(); fireFlare(); }
  if (e.key==='ArrowLeft' || e.key==='z' || e.key==='Z'){ e.preventDefault(); fireGun(); }
});

layout(); draw(); requestAnimationFrame(frame);
</script>
</body>
</html>
