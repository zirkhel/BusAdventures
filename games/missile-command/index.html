<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MISSILE WATCH — Bus Adventures</title>
<style>
  :root{--case:#141a21;--case-hi:#26313d;--key:#1f2a33;--key-lip:#0b1015;--key-on:#2f4050;--alarm:#c8412f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070b0f;font-family:"Helvetica Neue",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  #device{width:100%;max-width:520px;background:var(--case);display:flex;flex-direction:column;border-radius:18px;padding:10px 10px 14px;margin:6px 0;border-top:1px solid var(--case-hi);box-shadow:0 18px 44px rgba(0,0,0,.7)}
  #brand{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:#5f7383;font-size:10px;letter-spacing:.2em}
  #brand b{color:#b6cbd9;font-size:12px;letter-spacing:.3em;flex:1;text-align:left}
  #btnHjem{padding:5px 9px;border-radius:7px;background:#1b242c;border:0;border-bottom:2px solid var(--key-lip);line-height:0;margin-right:2px}
  #btnHjem svg{width:13px;height:13px;fill:#6d8291}
  #alarm{width:8px;height:8px;border-radius:50%;background:#1f2a33;margin:0 6px}
  #alarm.lit{background:var(--alarm);box-shadow:0 0 9px var(--alarm)}
  #btnMeny{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.14em;border-radius:7px;background:#1b242c;color:#6d8291;border:0;border-bottom:2px solid var(--key-lip)}
  #screen{position:relative;background:#060a0e;border-radius:6px;padding:5px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.6);min-height:220px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:3px;background:#000}
  #pad{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:12px}
  #pad button{background:var(--key);border:0;border-radius:16px;padding:0;height:76px;border-bottom:4px solid var(--key-lip);display:flex;align-items:center;justify-content:center;color:#8aa3b5;font-size:10px;font-weight:700;letter-spacing:.14em;touch-action:manipulation}
  #pad button:active,#pad button.ned{background:var(--key-on);border-bottom-width:2px;transform:translateY(2px)}
  #left,#right{opacity:.38;color:#4a5d6a;pointer-events:none}
  #special{opacity:.7;color:#e8c15c}
  #meny{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;border-radius:4px;background:rgba(4,8,12,.92);z-index:5}
  #meny.vis{display:flex}
  #menyKort{width:min(300px,92%);text-align:center;padding:4px}
  #menyKort h1{margin:0;font-size:15px;letter-spacing:.26em;color:#7CFF7C}
  #menyKort .under{margin:4px 0 12px;font-size:11px;letter-spacing:.16em;color:#6d8291}
  #menyResultat{margin:0 0 12px;display:none}
  #menyResultat.vis{display:block}
  #menyResultat .tittel{font-size:12px;color:#c8412f;letter-spacing:.14em;font-weight:700}
  #menyResultat .tall,#menyResultat .poeng,#menyResultat .rekord{font-size:12px;color:#7fd4c8;margin-top:4px;font-family:"Courier New",monospace;font-weight:700}
  .valg{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-bottom:8px;padding:13px 16px;border-radius:11px;background:#1f2a33;border:0;border-bottom:3px solid var(--key-lip)}
  .valg b{font-size:13px;letter-spacing:.14em;color:#dceaf3}
  .valg span{font-size:10px;color:#6d8291}
  .hint{font-size:10px;color:#5f7383;line-height:1.6;margin-top:10px}
  #btnTilbake{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-top:6px;padding:13px 16px;border-radius:11px;background:#162028;border:0;border-bottom:3px solid var(--key-lip)}
  #btnTilbake b{font-size:13px;letter-spacing:.14em;color:#8aa3b5}
  #btnTilbake span{font-size:10px;color:#6d8291}
  #err{display:none;position:absolute;left:6px;right:6px;top:6px;z-index:20;padding:8px;background:#3a1414;color:#ffb3a7;font:11px/1.4 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="device">
  <div id="brand">
    <button id="btnHjem" type="button"><svg viewBox="0 0 24 24"><path fill="#6d8291" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <b>MISSILE WATCH</b>
    <span id="alarm"></span>
    <button id="btnMeny" type="button">MENU</button>
  </div>
  <div id="screen">
    <canvas id="cv" width="640" height="520"></canvas>
    <div id="meny" class="vis">
      <div id="menyKort">
        <h1>MISSILE WATCH</h1>
        <div class="under">Choose game · v1</div>
        <div id="menyResultat">
          <div class="tittel" id="menyTittel">CITIES LOST</div>
          <div class="tall" id="menyTall"></div>
          <div class="poeng" id="menyPoeng"></div>
          <div class="rekord" id="menyRekord"></div>
        </div>
        <button class="valg" data-mode="A"><b>GAME A</b><span>Slow rain.</span></button>
        <button class="valg" data-mode="B"><b>GAME B</b><span>Fast tracks.</span></button>
        <button class="valg" data-mode="C"><b>GAME C</b><span>Splitters.</span></button>
        <p class="hint">Tap to aim. Nearest live post fires. Incoming trails<br>
        fan out — and split in Game C. Dead post cannot fire.</p>
        <button type="button" id="btnTilbake"><b>BACK</b><span>Bus Adventures</span></button>
      </div>
    </div>
    <div id="err"></div>
  </div>
  <div id="pad">
    <button id="left" type="button">—</button>
    <button id="special" type="button">TAP SCREEN</button>
    <button id="right" type="button">—</button>
  </div>
</div>
<script>
const HJEM='../../index.html';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const meny=document.getElementById('meny'), menyResultat=document.getElementById('menyResultat');
const alarmLed=document.getElementById('alarm'), errBox=document.getElementById('err');
const W=320, H=260, GROUND=236;
const POSTS=[{x:28},{x:160},{x:292}];
const CITIES=[{x:68},{x:108},{x:212},{x:256}];
const NIVA={
  A:{inSpeed:16, spawn:2200, waveN:4, ammo:20, split:false, pack:1},
  B:{inSpeed:22, spawn:1600, waveN:5, ammo:18, split:false, pack:2},
  C:{inSpeed:26, spawn:1400, waveN:6, ammo:16, split:true, pack:2}
};
let S=null, crashed=false;

function beste(m){ try{return +localStorage.getItem('ba_mc_'+m)||0;}catch(e){return 0;} }
function lagre(m,s){ try{const h=beste(m); if(s>h){localStorage.setItem('ba_mc_'+m,String(s));return true;}}catch(e){} return false; }
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

function reset(mode){
  S={
    mode, wave:1, score:0,
    posts: POSTS.map(p=>({x:p.x, y:GROUND, alive:true, ammo:NIVA[mode].ammo})),
    cities: CITIES.map(c=>({x:c.x, alive:true})),
    incoming:[], outgoing:[], blasts:[], fx:[],
    spawn:1400, left:NIVA[mode].waveN,
    over:false, paused:false, last:0, menyPlanlagt:false,
    flash:0, shake:0, clearWait:0, dying:0, nyRekord:false
  };
  meny.classList.remove('vis');
}

function liveCities(){ return S.cities.filter(c=>c.alive).length; }
function livePosts(){ return S.posts.filter(p=>p.alive); }
function totalAmmo(){ return S.posts.reduce((a,p)=>a+(p.alive?p.ammo:0),0); }

function targetList(){
  const t=S.cities.filter(c=>c.alive).map(c=>({x:c.x,y:GROUND-2}));
  for(const p of S.posts) if(p.alive) t.push({x:p.x,y:p.y});
  return t;
}

function addIn(x0,y0,tx,ty,spd,split){
  S.incoming.push({x:x0,y:y0,x0,y0,tx,ty,spd,split:!!split});
}

function spawnIn(){
  const n=NIVA[S.mode];
  const tars=targetList();
  if(!tars.length) return;
  const apex=20+Math.random()*(W-40);
  const bundle = n.pack<=1 ? 1 : (Math.random()<0.45 ? 2 : 1);
  for(let k=0;k<bundle;k++){
    const tar=tars[(Math.random()*tars.length)|0];
    addIn(apex+(k-bundle/2)*6, 14, tar.x, tar.y, n.inSpeed+S.wave*3+Math.random()*8, n.split && Math.random()<0.35);
  }
}

function nearestPost(lx,ly){
  let best=null, bestD=1e9;
  for(const p of S.posts){
    if(!p.alive || p.ammo<=0) continue;
    const d=Math.hypot(p.x-lx, p.y-ly);
    if(d<bestD){ bestD=d; best=p; }
  }
  return best;
}

function fireAt(lx, ly){
  if(!S || S.over || S.paused || S.dying) return;
  if(ly>GROUND-18) ly=GROUND-18;
  if(ly<20) ly=20;
  const p=nearestPost(lx,ly);
  if(!p) return;
  p.ammo--;
  S.outgoing.push({x:p.x, y:p.y-8, ox:p.x, oy:p.y-8, tx:lx, ty:ly, spd:160});
  buzz(6);
}

function burst(x,y,n,kind){
  if(S.fx.length>100) S.fx.splice(0, S.fx.length-80);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=kind==='boom'?30+Math.random()*70:kind==='dust'?8+Math.random()*22:12+Math.random()*36;
    S.fx.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp-(kind==='up'?25:8),
      t:kind==='boom'?500:260+Math.random()*160,
      kind, s:kind==='smoke'?3+Math.random()*3:1+Math.random()*2
    });
  }
}

function blast(x,y,maxR){
  S.blasts.push({x,y,r:2, max:maxR||20, grow:48, hold:260});
  S.blasts.push({x,y,r:1, max:(maxR||20)*0.55, grow:36, hold:180});
  burst(x,y,12,'boom');
  burst(x,y,8,'spark');
  burst(x,y,5,'smoke');
  S.flash=5; S.shake=5;
}

function bombImpact(x,y){
  S.blasts.push({x:x,y:y,r:3, max:26, grow:55, hold:340});
  S.blasts.push({x:x, y:y-8, r:2, max:14, grow:28, hold:420});
  burst(x,y,16,'boom');
  burst(x,y,10,'spark');
  burst(x,y-4,10,'up');
  burst(x,y,8,'smoke');
  burst(x,y,8,'dust');
  S.flash=8; S.shake=8;
}

function nextWave(){
  S.wave++;
  const n=NIVA[S.mode];
  for(const p of S.posts) if(p.alive) p.ammo += n.ammo;
  S.left = n.waveN + S.wave*2;
  S.spawn=1600;
  S.score += liveCities()*50 + totalAmmo()*2;
}

function gameOver(){
  S.over=true;
  S.dying=900;
  S.nyRekord=lagre(S.mode,S.score);
  buzz(50);
}

function hitCityOrBase(m){
  for(const c of S.cities){
    if(!c.alive) continue;
    if(Math.abs(m.x-c.x)<12 && m.y>GROUND-16){
      c.alive=false;
      bombImpact(c.x, GROUND-6);
      buzz(24);
      return true;
    }
  }
  for(const p of S.posts){
    if(!p.alive) continue;
    if(Math.abs(m.x-p.x)<14 && m.y>p.y-12){
      p.alive=false; p.ammo=0;
      bombImpact(p.x, p.y-4);
      buzz(28);
      return true;
    }
  }
  return false;
}

function update(dt){
  const t=dt/1000;
  const n=NIVA[S.mode];
  if(S.flash>0) S.flash--;
  if(S.shake>0){ S.shake*=0.8; if(S.shake<0.2) S.shake=0; }
  for(const f of S.fx){
    f.t-=dt; f.x+=f.vx*t; f.y+=f.vy*t;
    f.vy+=(f.kind==='smoke'?12:f.kind==='up'?20:70)*t;
    f.vx*=0.99;
  }
  S.fx=S.fx.filter(f=>f.t>0);

  if(S.dying>0){ S.dying-=dt; return; }
  if(S.over) return;

  if(S.clearWait>0){
    S.clearWait-=dt;
    if(S.clearWait<=0) nextWave();
    return;
  }

  S.spawn-=dt;
  if(S.left>0 && S.spawn<=0){
    spawnIn(); S.left--;
    S.spawn = Math.max(900, n.spawn - S.wave*40);
  }

  for(const m of S.incoming){
    const dx=m.tx-m.x, dy=m.ty-m.y, dist=Math.hypot(dx,dy)||1;
    const step=m.spd*t;
    if(n.split && m.split && m.y>68 && m.y<80){
      m.split=false;
      const tars=targetList();
      if(tars.length){
        const tar=tars[(Math.random()*tars.length)|0];
        addIn(m.x, m.y, tar.x, tar.y, m.spd+8, false);
      }
    }
    if(step>=dist){ m.x=m.tx; m.y=m.ty; m.hit=true; }
    else { m.x+=dx/dist*step; m.y+=dy/dist*step; }
  }
  for(const m of S.incoming){
    if(m.hit) hitCityOrBase(m);
  }
  S.incoming=S.incoming.filter(m=>!m.hit && m.y<H);

  for(const o of S.outgoing){
    const dx=o.tx-o.x, dy=o.ty-o.y, dist=Math.hypot(dx,dy)||1;
    const step=o.spd*t;
    if(step>=dist){ o.x=o.tx; o.y=o.ty; o.done=true; blast(o.tx,o.ty,20); }
    else { o.x+=dx/dist*step; o.y+=dy/dist*step; }
  }
  S.outgoing=S.outgoing.filter(o=>!o.done);

  for(const b of S.blasts){
    if(b.r<b.max) b.r+=b.grow*t;
    else b.hold-=dt;
    for(const m of S.incoming){
      if(Math.hypot(m.x-b.x,m.y-b.y) < b.r+1){
        m.hit=true; S.score+=25;
        burst(m.x,m.y,7,'spark');
        burst(m.x,m.y,4,'smoke');
      }
    }
  }
  S.incoming=S.incoming.filter(m=>!m.hit);
  S.blasts=S.blasts.filter(b=>b.hold>0 || b.r<b.max);

  if(liveCities()===0 || !livePosts().length) gameOver();
  if(S.left<=0 && !S.incoming.length && !S.outgoing.length && !S.blasts.length && !S.over)
    S.clearWait=700;
}

function drawGround(){
  px(0,GROUND,W,H-GROUND,'#2a1c12');
  px(0,GROUND,W,2,'#c4a574');
  px(0,GROUND+8,W,1,'#6a4a2a');
  for(const p of S.posts){
    const y=GROUND;
    if(!p.alive){ px(p.x-10, y-3, 20, 3, '#4a3020'); continue; }
    px(p.x-14, y-7, 28, 7, '#5a6a78');
    px(p.x-11, y-11, 22, 4, '#8aa3b5');
    px(p.x-7, y-14, 14, 3, '#9bb0c0');
    px(p.x-8, y-13, 3, 5, '#2a3038');
    px(p.x+5, y-13, 3, 5, '#2a3038');
    px(p.x-2, y-16, 4, 3, '#c8d4de');
    if(p.ammo>0) px(p.x-1, y-18, 2, 2, '#5ec8ff');
  }
  S.cities.forEach((c,i)=>{
    const x=c.x, y=GROUND;
    if(!c.alive){
      px(x-12, y-3, 24, 3, '#4a3020');
      px(x-4, y-5, 3, 2, '#6a4a2a');
      return;
    }
    const wall=['#c45a3a','#8a6a4a','#6a7a98','#b86848'][i%4];
    const wall2=['#a84830','#6e5538','#556378','#8a4a38'][i%4];
    px(x-12, y-10, 10, 10, wall);
    px(x-3, y-16, 8, 16, wall2);
    px(x+6, y-12, 8, 12, wall);
    px(x-11, y-13, 8, 3, '#e8d5a8');
    px(x-2, y-19, 6, 3, '#d4c4a0');
    px(x+7, y-15, 6, 3, '#e8d5a8');
    if(i===1) px(x, y-24, 2, 5, '#8aa3b5');
    if(i===2) px(x+8, y-18, 2, 3, '#c45a3a');
    const lit='#ffe08a', off='#2a1810';
    px(x-10, y-8, 2, 2, i%2?lit:off);
    px(x-7, y-8, 2, 2, off);
    px(x-1, y-14, 2, 2, lit);
    px(x+2, y-10, 2, 2, off);
    px(x+8, y-9, 2, 2, lit);
    px(x-1, y-6, 3, 6, '#1a1210');
  });
}

function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle='#0a1020'; ctx.fillRect(0,0,W,H);
  if(!S){
    ctx.fillStyle='#3a4a6a';
    for(let i=0;i<16;i++) ctx.fillRect((i*41)%W, 18+(i*17)%90, 1, 1);
    return;
  }
  ctx.save();
  if(S.shake) ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);
  ctx.fillStyle='#3a4a6a';
  for(let i=0;i<20;i++) ctx.fillRect((i*47)%W, 14+(i*19)%100, 1, 1);
  px(W-40, 22, 8, 8, '#e8d5a8');
  px(W-38, 24, 4, 4, '#fff3a0');

  ctx.lineWidth=1;
  for(const m of S.incoming){
    ctx.strokeStyle='#ff6a3a';
    ctx.beginPath();
    ctx.moveTo(m.x0, m.y0);
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
    px(m.x-1,m.y-2,3,5,'#ff6a3a');
    px(m.x,m.y-3,1,2,'#fff3a0');
    px(m.x-2,m.y+1,5,2,'#c8412f');
  }
  ctx.strokeStyle='#5ec8ff';
  for(const o of S.outgoing){
    ctx.beginPath();
    ctx.moveTo(o.ox, o.oy);
    ctx.lineTo(o.x,o.y);
    ctx.stroke();
    px(o.x-1,o.y-1,2,2,'#c8ffc8');
  }
  for(const b of S.blasts){
    const a = b.r<b.max ? 0.28 : 0.12;
    ctx.fillStyle = b.r<b.max ? 'rgba(255,224,138,'+a+')' : 'rgba(94,200,255,'+a+')';
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = b.r<b.max ? '#ffe08a' : '#5ec8ff';
    ctx.stroke();
  }
  for(const f of S.fx){
    const life=Math.max(0,Math.min(1,f.t/280));
    const k=f.kind||'spark';
    if(k==='smoke') ctx.fillStyle='rgba(120,110,100,'+(0.15+life*0.4)+')';
    else if(k==='dust') ctx.fillStyle='rgba(160,110,60,'+(0.25+life*0.4)+')';
    else if(k==='up') ctx.fillStyle=life>0.4?'#ff9a4a':'#6a5a50';
    else if(k==='boom') ctx.fillStyle=life>0.5?'#ffe08a':'#ff6a3a';
    else ctx.fillStyle=life>0.4?'#fff3a0':'#ff9a4a';
    const s=Math.max(1,f.s||2);
    ctx.fillRect(f.x,f.y,s,s);
  }

  drawGround();
  if(S.flash>0){ ctx.fillStyle='rgba(255,200,80,'+(S.flash/12)+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();

  ctx.fillStyle='#e8d5a8';
  ctx.font='10px monospace';
  ctx.fillText(String(S.score).padStart(5,'0'), 8, 12);
  ctx.fillText('WAVE '+S.wave, 80, 12);
  ctx.fillText('AMMO '+totalAmmo(), 150, 12);
  alarmLed.classList.toggle('lit', !!(S.over || liveCities()<=1 || livePosts().length<=1));
}

function planleggMeny(){
  if(!S || S.menyPlanlagt || S.dying>0) return;
  S.menyPlanlagt=true;
  document.getElementById('menyTittel').textContent='CITIES LOST';
  document.getElementById('menyTall').textContent='WAVE '+S.wave;
  document.getElementById('menyPoeng').textContent='SCORE '+String(S.score).padStart(4,'0');
  document.getElementById('menyRekord').textContent=S.nyRekord?'NEW HI '+S.score:'HI '+beste(S.mode);
  menyResultat.classList.add('vis');
  meny.classList.add('vis');
}

function frame(t){
  if(crashed) return;
  try{
    if(!S){ draw(); requestAnimationFrame(frame); return; }
    if(!S.last) S.last=t;
    let dt=t-S.last; S.last=t;
    if(dt>250) dt=16.7; else if(dt>66) dt=66;
    if(!S.paused) update(dt);
    if(S.over) planleggMeny();
    draw();
  }catch(e){
    crashed=true;
    errBox.style.display='block';
    errBox.textContent=String(e&&e.stack?e.stack:e);
  }
  requestAnimationFrame(frame);
}

function layout(){
  const screen=document.getElementById('screen');
  const r=screen.getBoundingClientRect();
  const maxW=Math.max(160,r.width-4), maxH=Math.max(140,r.height-4);
  const s=Math.min(maxW/W, maxH/H);
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize', layout);

function canvasPos(ev){
  const r=cv.getBoundingClientRect();
  const p=ev.touches?ev.touches[0]:ev;
  return { x:(p.clientX-r.left)*(W/r.width), y:(p.clientY-r.top)*(H/r.height) };
}
cv.addEventListener('pointerdown', ev=>{
  ev.preventDefault();
  if(!S || meny.classList.contains('vis')) return;
  const p=canvasPos(ev);
  fireAt(p.x, p.y);
});

document.getElementById('btnMeny').addEventListener('click', ()=>{
  if(!S||S.over){ meny.classList.add('vis'); return; }
  S.paused=!S.paused;
  meny.classList.toggle('vis', S.paused);
});
function goHjem(){ window.location.href=HJEM; }
document.getElementById('btnHjem').addEventListener('click', goHjem);
document.getElementById('btnTilbake').addEventListener('click', goHjem);
document.querySelectorAll('.valg').forEach(btn=>btn.addEventListener('click',()=>{
  reset(btn.getAttribute('data-mode'));
  menyResultat.classList.remove('vis');
}));

layout(); draw(); requestAnimationFrame(frame);
</script>
</body>
</html>
