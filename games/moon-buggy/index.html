<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MOON BUGGY — Bus Adventures</title>
<style>
  :root{--case:#141a21;--case-hi:#26313d;--key:#1f2a33;--key-lip:#0b1015;--key-on:#2f4050;--alarm:#c8412f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070b0f;font-family:"Helvetica Neue",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  #device{width:100%;max-width:520px;background:var(--case);display:flex;flex-direction:column;border-radius:18px;padding:10px 10px 14px;margin:6px 0;border-top:1px solid var(--case-hi);box-shadow:0 18px 44px rgba(0,0,0,.7)}
  #brand{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:#5f7383;font-size:10px;letter-spacing:.2em}
  #brand b{color:#b6cbd9;font-size:12px;letter-spacing:.3em;flex:1;text-align:left}
  #btnHjem{padding:5px 9px;border-radius:7px;background:#1b242c;border:0;border-bottom:2px solid var(--key-lip);line-height:0;margin-right:2px}
  #btnHjem svg{width:13px;height:13px;fill:#6d8291}
  #alarm{width:8px;height:8px;border-radius:50%;background:#1f2a33;margin:0 6px}
  #alarm.lit{background:var(--alarm);box-shadow:0 0 9px var(--alarm)}
  #btnMeny{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.14em;border-radius:7px;background:#1b242c;color:#6d8291;border:0;border-bottom:2px solid var(--key-lip)}
  #screen{position:relative;background:#060a0e;border-radius:6px;padding:5px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.6);min-height:220px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:3px;background:#000}
  #pad{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:12px}
  #pad button{background:var(--key);border:0;border-radius:16px;padding:0;height:76px;border-bottom:4px solid var(--key-lip);color:#8aa3b5;font-size:10px;font-weight:700;letter-spacing:.14em;touch-action:manipulation}
  #pad button:active,#pad button.ned{background:var(--key-on);border-bottom-width:2px;transform:translateY(2px);color:#e2f1fa}
  #left,#right,#special{color:#e8c15c}
  #meny{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;border-radius:4px;background:rgba(4,8,12,.92);z-index:5}
  #meny.vis{display:flex}
  #menyKort{width:min(300px,92%);text-align:center;padding:4px}
  #menyKort h1{margin:0;font-size:15px;letter-spacing:.26em;color:#e8d5a8}
  #menyKort .under{margin:4px 0 12px;font-size:11px;letter-spacing:.16em;color:#6d8291}
  #menyResultat{margin:0 0 12px;display:none}
  #menyResultat.vis{display:block}
  #menyResultat .tittel{font-size:12px;color:#c8412f;letter-spacing:.14em;font-weight:700}
  #menyResultat .tall,#menyResultat .poeng,#menyResultat .rekord{font-size:12px;color:#7fd4c8;margin-top:4px;font-family:"Courier New",monospace;font-weight:700}
  .valg{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-bottom:8px;padding:13px 16px;border-radius:11px;background:#1f2a33;border:0;border-bottom:3px solid var(--key-lip)}
  .valg b{font-size:13px;letter-spacing:.14em;color:#dceaf3}
  .valg span{font-size:10px;color:#6d8291}
  .hint{font-size:10px;color:#5f7383;line-height:1.6;margin-top:10px}
  #btnTilbake{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-top:6px;padding:13px 16px;border-radius:11px;background:#162028;border:0;border-bottom:3px solid var(--key-lip)}
  #btnTilbake b{font-size:13px;letter-spacing:.14em;color:#8aa3b5}
  #btnTilbake span{font-size:10px;color:#6d8291}
  #err{display:none;position:absolute;left:6px;right:6px;top:6px;z-index:20;padding:8px;background:#3a1414;color:#ffb3a7;font:11px/1.4 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="device">
  <div id="brand">
    <button id="btnHjem" type="button"><svg viewBox="0 0 24 24"><path fill="#6d8291" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <b>MOON BUGGY</b>
    <span id="alarm"></span>
    <button id="btnMeny" type="button">MENU</button>
  </div>
  <div id="screen">
    <canvas id="cv" width="640" height="520"></canvas>
    <div id="meny" class="vis">
      <div id="menyKort">
        <h1>MOON BUGGY</h1>
        <div class="under">Choose game · v3</div>
        <div id="menyResultat">
          <div class="tittel" id="menyTittel">WRECKED</div>
          <div class="tall" id="menyTall"></div>
          <div class="poeng" id="menyPoeng"></div>
          <div class="rekord" id="menyRekord"></div>
        </div>
        <button class="valg" data-mode="A"><b>GAME A</b><span>Easy craters.</span></button>
        <button class="valg" data-mode="B"><b>GAME B</b><span>Rocks + UFOs.</span></button>
        <button class="valg" data-mode="C"><b>GAME C</b><span>Bombing runs.</span></button>
        <p class="hint">Moon Patrol set: pits, rocks, mines, UFOs, crater bombs,<br>
        tanks, plants, rolling stones, cars from behind.</p>
        <button type="button" id="btnTilbake"><b>BACK</b><span>Bus Adventures</span></button>
      </div>
    </div>
    <div id="err"></div>
  </div>
  <div id="pad">
    <button id="left" type="button">◀</button>
    <button id="special" type="button">JUMP</button>
    <button id="right" type="button">▶</button>
  </div>
</div>
<script>
const HJEM='../../index.html';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const meny=document.getElementById('meny'), menyResultat=document.getElementById('menyResultat');
const alarmLed=document.getElementById('alarm'), errBox=document.getElementById('err');
const W=320, H=260, GROUND=200;
const NIVA={
  A:{base:46, gap:420, ufo:0, bomb:false, ufoAfter:1800},
  B:{base:56, gap:360, ufo:1, bomb:true, ufoAfter:900},
  C:{base:66, gap:300, ufo:2, bomb:true, ufoAfter:500}
};
let S=null, crashed=false, keys={left:false, right:false};

function beste(m){ try{return +localStorage.getItem('ba_mb_'+m)||0;}catch(e){return 0;} }
function lagre(m,s){ try{const h=beste(m); if(s>h){localStorage.setItem('ba_mb_'+m,String(s));return true;}}catch(e){} return false; }
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

function reset(mode){
  S={
    mode, score:0, bonus:0, lives:3, dist:0, scroll:0,
    px:70, py:GROUND, vy:0, air:false, jumps:0, spd:NIVA[mode].base, fireT:0,
    shots:[], rocks:[], pits:[], mines:[], boulders:[], tanks:[], plants:[], cars:[],
    ufos:[], bombs:[], fx:[], stars:[], streak:null, nextTank:0, nextCar:0,
    nextG:140, nextU:NIVA[mode].ufoAfter, invuln:0,
    over:false, paused:false, last:0, menyPlanlagt:false,
    flash:0, shake:0, dying:0, fallVy:0, nyRekord:false, arsak:''
  };
  for(let i=0;i<36;i++){
    S.stars.push({
      x:Math.random()*W,
      y:8+Math.random()*(GROUND-50),
      s:Math.random()<0.25?2:1,
      ph:Math.random()*Math.PI*2,
      sp:0.012+Math.random()*0.03,
      layer: Math.random()<0.4?0:1
    });
  }
  meny.classList.remove('vis');
}

function burst(x,y,n,kind){
  if(S.fx.length>80) S.fx.splice(0,20);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=20+Math.random()*50;
    S.fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-10,t:280,kind});
  }
}

function jump(){
  if(!S||S.over||S.paused||S.dying) return;
  if(S.air) return;
  const extra = (S.spd-40)*0.6;
  S.vy = -155 - extra;
  S.air=true; S.jumps=1;
}

function autoFire(){
  const front=S.shots.filter(s=>s.vy===0);
  const up=S.shots.filter(s=>s.vy<0);
  if(front.length<1) S.shots.push({x:S.px+18, y:S.py-14, vx:170, vy:0});
  if(up.length<3) S.shots.push({x:S.px+8, y:S.py-20, vx:10, vy:-170});
}

function crash(why){
  if(S.dying||S.over||S.invuln>0) return;
  S.lives--; S.arsak=why;
  S.dying = S.lives<=0 ? 1400 : 800;
  S.fallVy=20;
  burst(S.px, S.py-8, 16, 'boom');
  S.flash=8; S.shake=7;
  buzz(S.lives<=0?50:28);
}

function finishCrash(){
  if(S.lives<=0){ S.over=true; S.nyRekord=lagre(S.mode,S.score); return; }
  S.dying=0; S.py=GROUND; S.vy=0; S.air=false; S.jumps=0; S.invuln=1000;
}

function spawnAhead(){
  const n=NIVA[S.mode];
  const d=S.dist, x=S.scroll+W+24;
  const roll=Math.random();
  if(d>160 && roll<0.28) S.mines.push({x});
  else if(d>1400 && n.ufo>=1 && roll<0.28) S.plants.push({x, hit:false, ph:0});
  else if(d>1100 && n.ufo>=2 && roll<0.22) S.boulders.push({x, hit:false});
  else if(roll<0.30) S.pits.push({x, w:16+Math.random()*18});
  else S.rocks.push({x, hit:false, hp: Math.random()<(d>200?0.45:0.22) ? 2:1, lock:0});
  S.nextG = n.gap + Math.random()*160;
}

function update(dt){
  const t=dt/1000, n=NIVA[S.mode];
  if(S.flash>0) S.flash--;
  if(S.shake>0){ S.shake*=0.82; if(S.shake<0.2) S.shake=0; }
  for(const f of S.fx){ f.t-=dt; f.x+=f.vx*t; f.y+=f.vy*t; f.vy+=80*t; }
  S.fx=S.fx.filter(f=>f.t>0);
  if(S.stars){
    for(const st of S.stars) st.ph += dt*0.004;
    if(!S.streak && Math.random()<0.004){
      S.streak={x:40+Math.random()*200, y:12+Math.random()*40, vx:90+Math.random()*40, vy:40+Math.random()*20, t:700};
    }
    if(S.streak){
      S.streak.t-=dt;
      S.streak.x+=S.streak.vx*t;
      S.streak.y+=S.streak.vy*t;
      if(S.streak.t<=0 || S.streak.x>W+10) S.streak=null;
    }
  }

  if(S.dying>0){
    S.dying-=dt;
    S.fallVy+=200*t; S.py+=S.fallVy*t;
    if(S.py>GROUND+8) S.py=GROUND+8;
    if(S.dying<=0) finishCrash();
    return;
  }
  if(S.over) return;
  if(S.invuln>0) S.invuln-=dt;

  if(keys.right) S.px += 70*t;
  if(keys.left) S.px -= 70*t;
  if(S.px<28) S.px=28;
  if(S.px>150) S.px=150;
  S.spd = n.base;
  const PX=S.px;
  S.scroll += S.spd * t;
  S.dist += S.spd * t;
  S.score = Math.floor(S.dist/8) + S.bonus;
  S.nextG -= S.spd*t;
  if(S.nextG<=0) spawnAhead();

  S.fireT -= dt;
  if(S.fireT<=0){ autoFire(); S.fireT=220; }

  if(S.air){
    S.vy += 400*t;
    S.py += S.vy*t;
    if(S.py>=GROUND){ S.py=GROUND; S.vy=0; S.air=false; S.jumps=0; }
  }

  for(const sh of S.shots){ sh.x+=sh.vx*t; sh.y+=sh.vy*t; }
  S.shots=S.shots.filter(sh=>sh.x<W+8 && sh.y>-8);

  for(const r of S.rocks){
    if(r.lock>0) r.lock-=dt;
    const rx=r.x-S.scroll;
    if(!r.hit){
      for(const sh of S.shots){
        if(sh.vy===0 && !r.lock && Math.abs(sh.x-rx)<10 && Math.abs(sh.y-(GROUND-8))<12){
          r.hp = (r.hp||1)-1; r.lock=260; sh.x=W+20;
          if(r.hp<=0){ r.hit=true; S.bonus+=15; burst(rx,GROUND-8,8,'spark'); }
          else burst(rx,GROUND-8,5,'spark');
        }
      }
      if(S.invuln<=0 && rx>PX-4 && rx<PX+22 && S.py>GROUND-14)
        crash('ROCK');
    }
  }
  S.rocks=S.rocks.filter(r=>r.x-S.scroll>-30);

  for(const p of S.pits){
    const sx=p.x-S.scroll;
    if(S.invuln<=0 && !S.air && sx<PX+16 && sx+p.w>PX+4)
      crash('PIT');
  }
  S.pits=S.pits.filter(p=>p.x-S.scroll>-40);

  for(const m of S.mines){
    const sx=m.x-S.scroll;
    if(S.invuln<=0 && !S.air && sx<PX+16 && sx+10>PX+4) crash('MINE');
  }
  S.mines=S.mines.filter(m=>m.x-S.scroll>-30);

  for(const b of S.boulders){
    b.x -= 40*t;
    const sx=b.x-S.scroll;
    for(const sh of S.shots){
      if(sh.vy===0 && Math.abs(sh.x-sx)<8 && Math.abs(sh.y-(GROUND-8))<10){
        b.hit=true; S.bonus+=10; burst(sx,GROUND-8,6,'spark'); sh.x=W+20;
      }
    }
    if(!b.hit && S.invuln<=0 && sx>PX-4 && sx<PX+20 && S.py>GROUND-16) crash('ROCK');
  }
  S.boulders=S.boulders.filter(b=>!b.hit && b.x-S.scroll>-30);

  for(const p of S.plants){
    p.ph+=dt;
    const sx=p.x-S.scroll, py=GROUND-10-Math.abs(Math.sin(p.ph/200))*8;
    for(const sh of S.shots){
      if(Math.abs(sh.x-sx)<8 && Math.abs(sh.y-py)<10){
        p.hit=true; S.bonus+=50; burst(sx,py,8,'spark');
      }
    }
    if(!p.hit && S.invuln<=0 && sx>PX-2 && sx<PX+18 && S.py>GROUND-18) crash('PLANT');
  }
  S.plants=S.plants.filter(p=>!p.hit && p.x-S.scroll>-30);

  S.nextTank = (S.nextTank||0)-dt;
  if(S.dist>1600 && S.nextTank<=0 && n.ufo>=1){
    S.tanks.push({x:S.scroll+W+20, shot:0, hit:false});
    S.nextTank=4200;
  }
  for(const tk of S.tanks){
    const sx=tk.x-S.scroll;
    tk.shot-=dt;
    if(tk.shot<=0 && sx<W && sx>PX+20){
      S.bombs.push({x:sx, y:GROUND-10, vy:-8, vx:-70, kind:'shell'});
      tk.shot=900;
    }
    for(const sh of S.shots){
      if(sh.vy===0 && Math.abs(sh.x-sx)<10 && Math.abs(sh.y-(GROUND-10))<10){
        tk.hit=true; S.bonus+=40; burst(sx,GROUND-10,10,'spark'); sh.x=W+20;
      }
    }
    if(!tk.hit && S.invuln<=0 && sx>PX-4 && sx<PX+20 && S.py>GROUND-16) crash('TANK');
  }
  S.tanks=S.tanks.filter(tk=>!tk.hit && tk.x-S.scroll>-30);

  S.nextCar = (S.nextCar||0)-dt;
  if(S.dist>2000 && S.nextCar<=0 && n.ufo>=2){
    S.cars.push({x:S.scroll+S.px-40, hit:false});
    S.nextCar=7000;
  }
  for(const c of S.cars){
    c.x += (S.spd+36)*t;
    const sx=c.x-S.scroll;
    for(const sh of S.shots){
      if(sh.vy===0 && Math.abs(sh.x-sx)<10 && Math.abs(sh.y-(GROUND-10))<10){
        c.hit=true; S.bonus+=80; burst(sx,GROUND-8,10,'spark');
      }
    }
    if(!c.hit && S.invuln<=0 && sx>PX-8 && sx<PX+18 && S.py>GROUND-16) crash('CAR');
  }
  S.cars=S.cars.filter(c=>!c.hit && c.x-S.scroll<W+40);

  S.nextU -= dt;
  const ufoOn = S.dist > n.ufoAfter*0.5;
  if(ufoOn && S.nextU<=0){
    let kind='std';
    if(S.dist>n.ufoAfter && n.bomb) kind = Math.random()<0.45 ? 'crater' : 'std';
    if(S.dist>n.ufoAfter+400 && Math.random()<0.35) kind='weave';
    S.ufos.push({x:W+10, y:40+Math.random()*40, vx:-(22+S.spd*0.12), t:0, kind, y0:40+Math.random()*30});
    S.nextU = n.ufo ? (3600 - n.ufo*350) : 5000;
  }
  for(const u of S.ufos){
    u.t+=dt; u.x += u.vx*t;
    if(u.kind==='weave') u.y = u.y0 + Math.sin(u.t/180)*16;
    const dropOn = !u.did && u.x<PX+100 && u.x>PX+10;
    if(dropOn){
      u.did=true;
      if(u.kind==='crater') S.bombs.push({x:u.x, y:u.y+6, vy:30, kind:'crater'});
      else S.bombs.push({x:u.x, y:u.y+6, vy:38, kind:'bomb'});
    }
    for(const sh of S.shots){
      if(sh.vy<0 && Math.abs(sh.x-u.x)<10 && Math.abs(sh.y-u.y)<8){
        u.dead=true; S.bonus += u.kind==='crater'?50:25; burst(u.x,u.y,10,'spark');
      }
    }
  }
  S.ufos=S.ufos.filter(u=>!u.dead && u.x>-20);
  for(const b of S.bombs){
    if(b.vx) b.x+=b.vx*t;
    b.vy+=70*t; b.y+=b.vy*t;
    for(const sh of S.shots){
      if(Math.abs(sh.x-b.x)<6 && Math.abs(sh.y-b.y)<8){ b.dead=true; S.bonus+=15; burst(b.x,b.y,5,'spark'); }
    }
    if(b.dead) continue;
    if(S.invuln<=0 && Math.abs(b.x-PX-8)<14 && Math.abs(b.y-(S.py-8))<12) crash('BOMB');
    if(b.y>=GROUND){
      if(b.kind==='crater') S.pits.push({x:S.scroll+b.x-10, w:24});
      burst(b.x,GROUND,10,'boom');
      b.dead=true;
    }
  }
  S.bombs=S.bombs.filter(b=>!b.dead && b.y<H && b.y>-20);
}

function drawBuggy(x,y){
  if(S.invuln>0 && !S.dying && ((S.invuln/80)|0)%2===0) return;
  const spin=((S.scroll/6)|0)%2;
  px(x+2, y-12, 20, 7, '#c8d4de');
  px(x+6, y-16, 10, 4, '#8aa3b5');
  px(x+8, y-15, 5, 3, '#5ec8ff');
  px(x, y-10, 4, 4, '#e8c15c');
  px(x+4, y-6, 5, 5, '#2a3038');
  px(x+16, y-6, 5, 5, '#2a3038');
  px(x+5, y-5, 3, 3, spin?'#e8d5a8':'#6a6a6a');
  px(x+17, y-5, 3, 3, spin?'#6a6a6a':'#e8d5a8');
}

function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle='#070b14'; ctx.fillRect(0,0,W,H);
  if(!S){ return; }
  ctx.save();
  if(S.shake) ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);

  for(const st of S.stars){
    const tw = 0.35+0.65*Math.abs(Math.sin(st.ph));
    const drift = (S.scroll * (st.layer?0.06:0.025) + st.x) % W;
    ctx.fillStyle = st.s>1 ? 'rgba(230,220,200,'+tw+')' : 'rgba(160,180,210,'+tw+')';
    ctx.fillRect(drift, st.y, st.s, st.s);
  }
  if(S.streak){
    ctx.strokeStyle='rgba(255,240,200,0.7)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(S.streak.x-10, S.streak.y-5);
    ctx.lineTo(S.streak.x, S.streak.y);
    ctx.stroke();
    px(S.streak.x, S.streak.y, 2, 2, '#fff3a0');
  }
  const earthX = ((W-44 - S.scroll*0.015)%(W+40)+W+40)%(W+40) - 20;
  px(earthX, 16, 18, 18, '#4a6a90');
  px(earthX+3, 19, 12, 12, '#6a8ab0');
  px(earthX+6, 22, 6, 6, '#b8d0e8');

  function ridge(speed, y0, amp, step, color){
    const off = S.scroll*speed;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(-20, GROUND);
    for(let x=-20;x<=W+20;x+=step){
      const u = x + off;
      const h = Math.sin(u*0.02)*amp*0.35 + Math.sin(u*0.011)*amp*0.65;
      ctx.lineTo(x, y0 - Math.abs(h));
    }
    ctx.lineTo(W+20, GROUND);
    ctx.closePath();
    ctx.fill();
  }
  ridge(0.12, GROUND-40, 28, 16, '#141c2c');
  ridge(0.28, GROUND-22, 20, 12, '#1c2838');
  ridge(0.48, GROUND-10, 14, 10, '#2a3444');

  const near = S.scroll*0.72;
  ctx.fillStyle='#323848';
  for(let i=-1;i<10;i++){
    const hx = i*40 - (near%40);
    const bump = 6+(i%3)*4;
    ctx.fillRect(hx, GROUND-bump, 28, bump);
    if(i%2===0) ctx.fillRect(hx+8, GROUND-bump-4, 10, 4);
  }

  px(0,GROUND,W,H-GROUND,'#3a342c');
  px(0,GROUND,W,2,'#c4b89a');
  for(let i=0;i<24;i++){
    const gx=((i*16)-(S.scroll%16));
    px(gx, GROUND+5, 3, 1, '#2a241c');
    px(gx+8, GROUND+11, 2, 1, '#241e18');
  }

  for(const p of S.pits){
    const x=p.x-S.scroll;
    px(x, GROUND-1, p.w, 14, '#070b14');
    px(x, GROUND+12, p.w, 2, '#1a1410');
  }
  for(const r of S.rocks){
    if(r.hit) continue;
    const x=r.x-S.scroll;
    if((r.hp||1)>=2){
      px(x-9, GROUND-14, 18, 14, '#6a5a48');
      px(x-7, GROUND-18, 14, 4, '#c4b49a');
      px(x-4, GROUND-10, 4, 4, '#3a3028');
      px(x+2, GROUND-12, 4, 3, '#e8d5a8');
    } else {
      px(x-6, GROUND-9, 12, 9, '#8a7a68');
      px(x-4, GROUND-12, 8, 3, '#c4b49a');
    }
  }
  for(const m of S.mines){
    const x=m.x-S.scroll;
    const blink=((Date.now()/180)|0)%2;
    px(x, GROUND-5, 8, 5, blink?'#ff6a3a':'#fff3a0');
    px(x+2, GROUND-7, 4, 2, '#c8412f');
  }
  for(const b of S.boulders){
    if(b.hit) continue;
    const x=b.x-S.scroll;
    px(x-6, GROUND-10, 12, 10, '#8a6040');
    px(x-4, GROUND-13, 8, 3, '#b88858');
  }
  for(const p of S.plants){
    if(p.hit) continue;
    const x=p.x-S.scroll;
    const h=8+Math.abs(Math.sin(p.ph/200))*8;
    px(x-2, GROUND-h, 5, h, '#4cbc62');
    px(x-4, GROUND-h-3, 9, 4, '#7CFF7C');
  }
  for(const tk of S.tanks){
    if(tk.hit) continue;
    const x=tk.x-S.scroll;
    px(x-8, GROUND-10, 16, 10, '#6d8291');
    px(x-4, GROUND-14, 8, 4, '#8aa3b5');
    px(x-10, GROUND-12, 6, 3, '#c8d4de');
  }
  for(const c of S.cars){
    if(c.hit) continue;
    const x=c.x-S.scroll;
    px(x-8, GROUND-10, 16, 8, '#c8412f');
    px(x-4, GROUND-13, 8, 3, '#e8c15c');
  }
  for(const u of S.ufos){
    if(u.kind==='crater'){
      px(u.x-7, u.y, 14, 6, '#e8c15c');
      px(u.x-3, u.y-3, 6, 3, '#fff3a0');
    } else if(u.kind==='weave'){
      px(u.x-9, u.y, 18, 4, '#ff6a3a');
      px(u.x-4, u.y-3, 8, 3, '#c8412f');
    } else {
      px(u.x-8, u.y, 16, 5, '#7CFF7C');
      px(u.x-4, u.y-3, 8, 3, '#c8ffc8');
    }
  }
  for(const b of S.bombs){
    px(b.x-1, b.y, 3, 5, '#ff6a3a');
  }
  for(const sh of S.shots){
    px(sh.x, sh.y, 3, 2, '#5ec8ff');
  }
  for(const f of S.fx){
    ctx.fillStyle=f.kind==='boom'?'#ff9a4a':'#ffe08a';
    ctx.fillRect(f.x,f.y,2,2);
  }

  drawBuggy(Math.round(S.px), Math.round(S.py));
  if(S.flash>0){ ctx.fillStyle='rgba(255,200,80,'+(S.flash/12)+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();

  ctx.fillStyle='#e8d5a8';
  ctx.font='10px monospace';
  ctx.fillText(String(S.score).padStart(5,'0'), 8, 12);
  ctx.fillText('KM '+Math.floor(S.dist/40), 80, 12);
  for(let i=0;i<S.lives;i++) px(W-14-i*12, 6, 8, 4, '#c8d4de');
  if(S.ufos.length) px(W-52, 6, 5, 5, '#ff6a3a');
  if(S.mines.some(m=>m.x-S.scroll<W && m.x-S.scroll>0)) px(W-52, 13, 5, 5, '#fff3a0');
  if(S.cars.length) px(W-52, 20, 5, 5, '#c8412f');
  alarmLed.classList.toggle('lit', !!(S.over || S.lives===1 || S.ufos.length));
}

function planleggMeny(){
  if(!S||S.menyPlanlagt||S.dying>0) return;
  S.menyPlanlagt=true;
  document.getElementById('menyTittel').textContent = S.arsak==='PIT'?'PIT':S.arsak==='BOMB'?'BOMBED':'WRECKED';
  document.getElementById('menyTall').textContent='KM '+Math.floor(S.dist/40);
  document.getElementById('menyPoeng').textContent='SCORE '+String(S.score).padStart(4,'0');
  document.getElementById('menyRekord').textContent=S.nyRekord?'NEW HI '+S.score:'HI '+beste(S.mode);
  menyResultat.classList.add('vis'); meny.classList.add('vis');
}

function frame(t){
  if(crashed) return;
  try{
    if(!S){ draw(); requestAnimationFrame(frame); return; }
    if(!S.last) S.last=t;
    let dt=t-S.last; S.last=t;
    if(dt>250) dt=16.7; else if(dt>66) dt=66;
    if(!S.paused) update(dt);
    if(S.over) planleggMeny();
    draw();
  }catch(e){
    crashed=true; errBox.style.display='block';
    errBox.textContent=String(e&&e.stack?e.stack:e);
  }
  requestAnimationFrame(frame);
}

function layout(){
  const screen=document.getElementById('screen');
  const r=screen.getBoundingClientRect();
  const s=Math.min(Math.max(160,r.width-4)/W, Math.max(140,r.height-4)/H);
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize', layout);

function hold(el, set){
  const on=ev=>{ ev.preventDefault(); set(true); el.classList.add('ned'); };
  const off=ev=>{ ev.preventDefault(); set(false); el.classList.remove('ned'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
hold(document.getElementById('left'), v=>keys.left=v);
hold(document.getElementById('right'), v=>keys.right=v);
document.getElementById('special').addEventListener('pointerdown', ev=>{ ev.preventDefault(); jump(); });
document.getElementById('btnMeny').addEventListener('click', ()=>{
  if(!S||S.over){ meny.classList.add('vis'); return; }
  S.paused=!S.paused; meny.classList.toggle('vis', S.paused);
});
function goHjem(){ window.location.href=HJEM; }
document.getElementById('btnHjem').addEventListener('click', goHjem);
document.getElementById('btnTilbake').addEventListener('click', goHjem);
document.querySelectorAll('.valg').forEach(btn=>btn.addEventListener('click',()=>{
  reset(btn.getAttribute('data-mode'));
  menyResultat.classList.remove('vis');
}));
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp'||e.key===' '){ e.preventDefault(); jump(); }
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
});

layout(); draw(); requestAnimationFrame(frame);
</script>
</body>
</html>
