<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SPACE WATCH — Bus Adventures</title>
<style>
  :root{--case:#141a21;--case-hi:#26313d;--key:#1f2a33;--key-lip:#0b1015;--key-on:#2f4050;--alarm:#c8412f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070b0f;font-family:"Helvetica Neue",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
  #device{width:100%;max-width:520px;background:var(--case);display:flex;flex-direction:column;border-radius:18px;padding:10px 10px 14px;margin:6px 0;border-top:1px solid var(--case-hi);box-shadow:0 18px 44px rgba(0,0,0,.7)}
  #brand{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:#5f7383;font-size:10px;letter-spacing:.2em}
  #brand b{color:#b6cbd9;font-size:12px;letter-spacing:.3em;flex:1;text-align:left}
  #btnHjem{padding:5px 9px;border-radius:7px;background:#1b242c;border:0;border-bottom:2px solid var(--key-lip);line-height:0;margin-right:2px}
  #btnHjem svg{width:13px;height:13px;fill:#6d8291}
  #alarm{width:8px;height:8px;border-radius:50%;background:#1f2a33;margin:0 6px}
  #alarm.lit{background:var(--alarm);box-shadow:0 0 9px var(--alarm)}
  #btnMeny{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.14em;border-radius:7px;background:#1b242c;color:#6d8291;border:0;border-bottom:2px solid var(--key-lip)}
  #screen{position:relative;background:#060a0e;border-radius:6px;padding:5px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.6);min-height:220px}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:3px;background:#000}
  #pad{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:12px}
  #pad button{background:var(--key);border:0;border-radius:16px;padding:0;height:76px;border-bottom:4px solid var(--key-lip);display:flex;align-items:center;justify-content:center;gap:6px;color:#8aa3b5;font-size:10px;font-weight:700;letter-spacing:.14em;touch-action:manipulation}
  #pad svg{width:28px;height:28px;fill:#8aa3b5;pointer-events:none}
  #pad button:active,#pad button.ned{background:var(--key-on);border-bottom-width:2px;transform:translateY(2px);color:#e2f1fa}
  #special{opacity:.38;color:#4a5d6a}
  #special.armed{opacity:1;color:#e8c15c}
  #special.armed svg{fill:#e8c15c}
  #meny{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;border-radius:4px;background:rgba(4,8,12,.92);z-index:5}
  #meny.vis{display:flex}
  #menyKort{width:min(300px,92%);text-align:center;padding:4px}
  #menyKort h1{margin:0;font-size:15px;letter-spacing:.26em;color:#7CFF7C}
  #menyKort .under{margin:4px 0 12px;font-size:11px;letter-spacing:.16em;color:#6d8291}
  #menyResultat{margin:0 0 12px;display:none}
  #menyResultat.vis{display:block}
  #menyResultat .tittel{font-size:12px;color:#c8412f;letter-spacing:.14em;font-weight:700}
  #menyResultat .tall,#menyResultat .poeng,#menyResultat .rekord{font-size:12px;color:#7fd4c8;margin-top:4px;font-family:"Courier New",monospace;font-weight:700}
  .valg{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-bottom:8px;padding:13px 16px;border-radius:11px;background:#1f2a33;border:0;border-bottom:3px solid var(--key-lip)}
  .valg b{font-size:13px;letter-spacing:.14em;color:#dceaf3}
  .valg span{font-size:10px;color:#6d8291}
  .hint{font-size:10px;color:#5f7383;line-height:1.6;margin-top:10px}
  #err{display:none;position:absolute;left:6px;right:6px;top:6px;z-index:20;padding:8px;background:#3a1414;color:#ffb3a7;font:11px/1.4 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="device">
  <div id="brand">
    <button id="btnHjem" type="button"><svg viewBox="0 0 24 24"><path fill="#6d8291" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <b>SPACE WATCH</b>
    <span id="alarm"></span>
    <button id="btnMeny" type="button">MENU</button>
  </div>
  <div id="screen">
    <canvas id="cv" width="640" height="520"></canvas>
    <div id="meny" class="vis">
      <div id="menyKort">
        <h1>SPACE WATCH</h1>
        <div class="under">Choose game · v5</div>
        <div id="menyResultat"><div class="tittel" id="menyTittel">GAME OVER</div><div class="tall" id="menyTall"></div><div class="poeng" id="menyPoeng"></div><div class="rekord" id="menyRekord"></div></div>
        <button class="valg" data-mode="A"><b>GAME A</b><span>Drill fire.</span></button>
        <button class="valg" data-mode="B"><b>GAME B</b><span>Live rounds.</span></button>
        <button class="valg" data-mode="C"><b>GAME C</b><span>They adapt.</span></button>
        <p class="hint">Hold the defence line. SPECIAL uses one perk.</p>
      </div>
    </div>
    <div id="err"></div>
  </div>
  <div id="pad">
    <button id="left" type="button">LEFT</button>
    <button id="special" type="button" aria-disabled="true">SPECIAL</button>
    <button id="right" type="button">RIGHT</button>
  </div>
</div>
<script>
const HJEM='../../index.html';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const meny=document.getElementById('meny'),menyResultat=document.getElementById('menyResultat');
const specialBtn=document.getElementById('special'),alarmLed=document.getElementById('alarm'),errBox=document.getElementById('err');
const W=320,H=260,COLS=11,ROWS=5,AL_W=16,AL_H=12,AL_GAPX=6,AL_GAPY=10;
const PLAYER_Y=H-36, DEF_LINE=PLAYER_Y+12, GROUND=DEF_LINE+4, BUNKER_Y=PLAYER_Y-42, LAND_Y=BUNKER_Y+8, STEP_X=4;
const NIVA={
  A:{move:620,drop:6,bombEvery:1400,bombSpeed:72,maxBombs:2,fire:300,lives:3},
  B:{move:520,drop:6,bombEvery:1100,bombSpeed:84,maxBombs:3,fire:250,lives:3},
  C:{move:360,drop:6,bombEvery:520,bombSpeed:118,maxBombs:4,fire:280,lives:3}
};
const TIER={1:{name:'COMMON',color:'#7CFF7C'},2:{name:'RARE',color:'#7fd4c8'},3:{name:'GOLD',color:'#e8c15c'}};
const PERK={
  pierce:{name:'PIERCE',tier:1,color:'#7CFF7C'},freeze:{name:'FREEZE',tier:1,color:'#7CFF7C'},
  flare:{name:'JAM',tier:1,color:'#7CFF7C'},clip:{name:'RAPID',tier:1,color:'#7CFF7C'},
  patch:{name:'PATCH',tier:1,color:'#7CFF7C'},slow:{name:'SLOW',tier:1,color:'#7CFF7C'},
  shield:{name:'SHIELD',tier:1,color:'#7CFF7C'},
  drone:{name:'DRONE',tier:2,color:'#7fd4c8'},homing:{name:'HOMING',tier:2,color:'#7fd4c8'},nuke:{name:'NUKE',tier:2,color:'#7fd4c8'},
  wide:{name:'WIDE',tier:3,color:'#e8c15c'},repair:{name:'REPAIR',tier:3,color:'#e8c15c'}
};
const PERK_KEYS=Object.keys(PERK);
function perksInTier(t){return PERK_KEYS.filter(k=>PERK[k].tier===t)}
let S=null,keys={left:false,right:false},crashed=false;
function buzz(p){if(navigator.vibrate)navigator.vibrate(p)}
function layout(){cv.width=W*2;cv.height=H*2;ctx.setTransform(1,0,0,1,0,0);ctx.scale(2,2);ctx.imageSmoothingEnabled=false}
function beste(m){try{return parseInt(localStorage.getItem('sw-hi-'+m)||'0',10)||0}catch(e){return 0}}
function lagreBeste(m,s){const hi=Math.max(beste(m),s);try{localStorage.setItem('sw-hi-'+m,String(hi))}catch(e){}return hi}
function bunkerTemplate(){
  return ['  ######  ',' ######## ','##########','##########','###    ###','##      ##']
    .map(r=>r.split('').map(ch=>ch==='#'?1:0));
}
function makeBunkers(){
  const tmpl=bunkerTemplate(),bw=tmpl[0].length*3,out=[],usable=W-24;
  for(let i=0;i<4;i++){
    const x=12+(usable/4)*i+(usable/4-bw)/2;
    out.push({x:Math.round(x),y:BUNKER_Y,cell:3,grid:tmpl.map(r=>r.slice()),grow:[]});
  }
  return out;
}
function alienKind(wave,r,c,mode){
  const every=mode==='C'?5:7;
  if((c+wave*2)%every===3&&(r===1||r===2))return 'elite';
  if(mode==='C'&&r===2&&c%5===0)return 'elite';
  if(r===0)return 'node';
  if(r<=2)return 'wing';
  return 'disc';
}
function spawnWave(wave){
  const grid=[];
  for(let r=0;r<ROWS;r++){const row=[];
    for(let c=0;c<COLS;c++){const k=alienKind(wave,r,c,S.mode);row.push({alive:true,kind:k,hp:k==='elite'?2:1})}
    grid.push(row)}
  const gridW=COLS*(AL_W+AL_GAPX)-AL_GAPX;
  S.form={x:Math.round((W-gridW)/2),y:36+Math.min(16,(wave-1)*4),dir:1,frame:0};
  S.grid=grid;S.alienCount=ROWS*COLS;S.bombAcc=18;S.drops=0;
}
function reset(mode){
  const n=NIVA[mode];
  S={mode,n,paused:false,over:false,waveClear:0,score:0,wave:1,lives:n.lives,nyRekord:false,arsak:null,levert:0,tapt:0,menyPlanlagt:false,
    px:W/2,recoil:0,fireAcc:0,bullets:[],bombs:[],crates:[],fx:[],bunkers:makeBunkers(),perk:null,shield:0,
    pierceShots:0,wideT:0,freezeT:0,flareT:0,clipT:0,slowT:0,hexWait:22000,drone:null,homing:[],nuke:null,
    ufo:null,ufoAcc:1800,bombAcc:18,moveAcc:0,blink:0,invuln:0,shake:0,flash:0,last:0};
  spawnWave(1);updateSpecialClass();meny.classList.remove('vis');
}
function livingAliens(){const o=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(S.grid[r][c].alive)o.push({r,c,a:S.grid[r][c]});return o}
function alienPos(r,c){return{x:S.form.x+c*(AL_W+AL_GAPX),y:S.form.y+r*(AL_H+AL_GAPY)}}
function lowestY(){let y=0;for(const it of livingAliens()){const p=alienPos(it.r,it.c);if(p.y+AL_H>y)y=p.y+AL_H}return y}
function formationBounds(){let minX=W,maxX=0;for(const it of livingAliens()){const p=alienPos(it.r,it.c);if(p.x<minX)minX=p.x;if(p.x+AL_W>maxX)maxX=p.x+AL_W}return{minX,maxX}}
function currentStepMs(){if(S.freezeT>0)return 99999;const left=Math.max(1,S.alienCount),gone=1-left/(ROWS*COLS);let mul=1-gone*0.22;if(left<=8)mul*=0.82;mul*=Math.pow(0.94,S.drops||0);return Math.max(110,S.n.move*Math.pow(0.95,S.wave-1)*mul)}
function award(n){S.score=Math.min(9999,S.score+n)}
function rollPerk(){const roll=Math.random();let tier=1;if(roll<0.20)tier=3;else if(roll<0.45)tier=2;const pool=perksInTier(tier);return pool[Math.floor(Math.random()*pool.length)]}
function spawnCrate(x,y){if(S.crates.length||S.perk)return;S.crates.push({x,y,kind:rollPerk(),vy:55,sway:Math.random()*6})}
function givePerk(k){if(S.perk)return;S.perk=k;updateSpecialClass();buzz(18)}
function updateSpecialClass(){const on=!!(S&&S.perk&&!S.paused&&!S.over);specialBtn.classList.toggle('armed',on);specialBtn.setAttribute('aria-disabled',on?'false':'true')}
function spawnHunter(){const list=livingAliens(),n=Math.min(list.length,3+Math.floor(Math.random()*3)),picks=[],pool=list.slice();while(picks.length<n&&pool.length)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);S.drone={x:-18,y:26,vx:160,marks:picks,hit:{}}}
function spawnHoming(){const lower=livingAliens().filter(it=>it.r>=2);const pool=(lower.length?lower:livingAliens()).slice();const n=Math.min(pool.length,3+Math.floor(Math.random()*3)),picks=[];while(picks.length<n&&pool.length)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);S.homing=picks.map((m,i)=>({x:S.px+(i-(picks.length-1)/2)*6,y:PLAYER_Y-8,r:m.r,c:m.c,wait:i*80}))}
function banner(t,c){S.fx.push({t:28,kind:'txt',txt:t,x:W/2,y:44,col:c})}
function useSpecial(){
  if(!S||S.over||S.paused||!S.perk)return;
  if(S.nuke||S.drone||(S.homing&&S.homing.length))return;
  const kind=S.perk;S.perk=null;updateSpecialClass();
  if(kind==='pierce'){S.pierceShots=4;banner('PIERCE',PERK.pierce.color)}
  else if(kind==='wide'){S.wideT=4000;banner('WIDE',PERK.wide.color)}
  else if(kind==='freeze'){S.freezeT=3500;S.fx.push({t:36,kind:'frost'});banner('FREEZE',PERK.freeze.color);buzz(30)}
  else if(kind==='drone'){spawnHunter();banner('DRONE',PERK.drone.color);buzz(20)}
  else if(kind==='homing'){spawnHoming();banner('HOMING',PERK.homing.color);buzz(20)}
  else if(kind==='flare'){S.flareT=4000;for(const b of S.bombs)S.fx.push({t:10,kind:'pop',x:b.x,y:b.y});S.bombs=[];S.fx.push({t:28,kind:'flare'});banner('JAM',PERK.flare.color);buzz(18)}
  else if(kind==='clip'){S.clipT=4000;banner('RAPID',PERK.clip.color);buzz(18)}
  else if(kind==='patch'){patchNearest();banner('PATCH',PERK.patch.color);buzz(25)}
  else if(kind==='slow'){S.slowT=4500;S.fx.push({t:24,kind:'frost'});banner('SLOW',PERK.slow.color);buzz(18)}
  else if(kind==='shield'){S.shield=1;banner('SHIELD',PERK.shield.color);buzz(20)}
  else if(kind==='repair'){startRepair();banner('REPAIR',PERK.repair.color);buzz(25)}
  else if(kind==='nuke'){S.nuke={phase:'rise',t:0,x:S.px,y0:PLAYER_Y-10,y1:BUNKER_Y-28,r:44};banner('NUKE',PERK.nuke.color);buzz(20)}
}
function growBunker(b){const tmpl=bunkerTemplate();b.grow=[];for(let gy=tmpl.length-1;gy>=0;gy--)for(let gx=0;gx<tmpl[gy].length;gx++)if(tmpl[gy][gx]&&!b.grid[gy][gx])b.grow.push({gx,gy})}
function patchNearest(){let best=null,d=1e9;for(const b of S.bunkers){const cx=b.x+(b.grid[0].length*b.cell)/2,dd=Math.abs(cx-S.px);if(dd<d){d=dd;best=b}}if(best)growBunker(best)}
function startRepair(){for(const b of S.bunkers)growBunker(b)}
function tickRepair(){for(const b of S.bunkers){if(!b.grow||!b.grow.length)continue;const n=Math.min(3,b.grow.length);for(let i=0;i<n;i++){const c=b.grow.shift();b.grid[c.gy][c.gx]=1;S.fx.push({t:8,kind:'spark',x:b.x+c.gx*b.cell+1,y:b.y+c.gy*b.cell+1})}}}
function detonateNuke(){const sx=S.nuke.x,sy=S.nuke.y1,R=S.nuke.r;S.fx.push({t:22,kind:'blast',x:sx,y:sy,r:R});S.flash=10;S.shake=10;buzz([40,30,90]);for(const it of livingAliens()){const p=alienPos(it.r,it.c),cx=p.x+AL_W/2,cy=p.y+AL_H/2;if((cx-sx)**2+(cy-sy)**2<=R*R)killAlien(it.r,it.c,true)}}
function killAlien(r,c,fromNuke){const a=S.grid[r][c];if(!a.alive)return;if(!fromNuke){a.hp--;if(a.hp>0){const p=alienPos(r,c);S.fx.push({t:8,kind:'spark',x:p.x+8,y:p.y+6});return}}a.alive=false;S.alienCount--;award(a.kind==='elite'?50:a.kind==='node'?30:a.kind==='wing'?20:10);const p=alienPos(r,c);S.fx.push({t:10,kind:'pop',x:p.x+8,y:p.y+6});if(!fromNuke&&Math.random()<0.10+Math.min(0.08,S.wave*0.012))spawnCrate(p.x+4,p.y);if(S.alienCount<=0){S.waveClear=55;award(50+S.wave*10)}}
function playerHit(){if(S.invuln>0)return;if(S.shield){S.shield=0;S.invuln=40;S.fx.push({t:14,kind:'shatter',x:S.px,y:PLAYER_Y});banner('BLOCKED',PERK.shield.color);buzz(30);return}S.lives--;S.tapt++;S.invuln=50;S.blink=40;S.shake=8;S.flash=6;buzz([40,40,80]);if(S.lives<=0)gameOver('HIT')}
function gameOver(a){S.over=true;S.arsak=a;S.paused=true;const hi=lagreBeste(S.mode,S.score);S.nyRekord=S.score>=hi&&S.score>0;updateSpecialClass()}
function hitBunker(x,y,r){for(const b of S.bunkers){const cw=b.cell;for(let gy=0;gy<b.grid.length;gy++)for(let gx=0;gx<b.grid[gy].length;gx++){if(!b.grid[gy][gx])continue;const cx=b.x+gx*cw,cy=b.y+gy*cw;if(x+r>=cx&&x-r<=cx+cw&&y+r>=cy&&y-r<=cy+cw){b.grid[gy][gx]=0;if(gy+1<b.grid.length&&Math.random()<0.45)b.grid[gy+1][gx]=0;return true}}}return false}
function explodeHex(x,y){const R=36;S.fx.push({t:20,kind:'blast',x,y,r:R});S.shake=8;S.flash=6;buzz([50,30,50]);for(const b of S.bunkers){const cw=b.cell;for(let gy=0;gy<b.grid.length;gy++)for(let gx=0;gx<b.grid[gy].length;gx++){if(!b.grid[gy][gx])continue;const cx=b.x+gx*cw+cw/2,cy=b.y+gy*cw+cw/2;if((cx-x)**2+(cy-y)**2<=R*R)b.grid[gy][gx]=0}}if(Math.hypot(x-S.px,y-PLAYER_Y)<R+4)playerHit()}
function emitShot(x,extra){const b={x,y:PLAYER_Y-12,vy:-280,pierce:false,pierced:[],safe:false};if(extra){if(extra.pierce)b.pierce=true;if(extra.safe)b.safe=true}S.bullets.push(b)}
function fire(){const pierce=S.pierceShots>0;if(!pierce&&!S.wideT&&S.bullets.some(b=>!b.pierce&&!b.safe))return;if(pierce)S.pierceShots--;S.recoil=5;if(S.wideT>0){emitShot(S.px-52,{pierce,safe:true});emitShot(S.px,{pierce,safe:true});emitShot(S.px+52,{pierce,safe:true})}else emitShot(S.px,{pierce})}
function maybeBomb(){
  const bottoms=[],elites=[];
  for(let c=0;c<COLS;c++){for(let r=ROWS-1;r>=0;r--){if(S.grid[r][c].alive){bottoms.push({r,c});break}}for(let r=0;r<ROWS;r++)if(S.grid[r][c].alive&&S.grid[r][c].kind==='elite')elites.push({r,c})}
  const hexOn=S.bombs.filter(b=>b.hex).length,hexChance=S.mode==='A'?0.08:S.mode==='B'?0.12:0.22;
  if(elites.length&&hexOn<1&&S.hexWait<=0&&Math.random()<hexChance){const e=elites[Math.floor(Math.random()*elites.length)],p=alienPos(e.r,e.c);S.bombs.push({x:p.x+AL_W/2,y:p.y+AL_H,vy:28,hex:true});S.hexWait=S.mode==='C'?Math.max(7000,14000-S.wave*1800):Math.max(12000,24000-S.wave*2000);return}
  if(!bottoms.length||S.bombs.filter(b=>!b.hex).length>=S.n.maxBombs)return;
  const pick=bottoms[Math.floor(Math.random()*bottoms.length)],p=alienPos(pick.r,pick.c);
  S.bombs.push({x:p.x+AL_W/2,y:p.y+AL_H,vy:S.n.bombSpeed,hex:false});
}
function maybeUfo(dt){if(S.ufo){S.ufo.x+=S.ufo.dir*80*(dt/1000);if(S.ufo.x<-36||S.ufo.x>W+36)S.ufo=null;return}S.ufoAcc+=dt;if(S.ufoAcc>5200&&Math.random()<0.006){S.ufoAcc=0;const dir=Math.random()<0.5?1:-1;S.ufo={x:dir>0?-24:W+24,y:22,dir}}}
function stepFormation(){S.form.frame^=1;const b=formationBounds(),next=S.form.x+S.form.dir*STEP_X,dx=next-S.form.x;if(b.minX+dx<6||b.maxX+dx>W-6){S.form.y+=S.n.drop;S.form.dir*=-1;S.drops=(S.drops||0)+1;if(lowestY()>=LAND_Y)gameOver('LANDED')}else S.form.x=next}
function update(dt){
  if(!S||S.over||S.paused)return;
  const spd=keys.left===keys.right?0:(keys.right?1:-1);
  S.px+=spd*120*(dt/1000);S.px=Math.max(14,Math.min(W-14,S.px));
  if(S.recoil>0)S.recoil--;if(S.invuln>0)S.invuln--;if(S.blink>0)S.blink--;if(S.flash>0)S.flash--;
  if(S.shake>0){S.shake*=0.84;if(S.shake<0.2)S.shake=0}
  if(S.wideT>0)S.wideT=Math.max(0,S.wideT-dt);if(S.freezeT>0)S.freezeT=Math.max(0,S.freezeT-dt);
  if(S.flareT>0)S.flareT=Math.max(0,S.flareT-dt);if(S.clipT>0)S.clipT=Math.max(0,S.clipT-dt);if(S.slowT>0)S.slowT=Math.max(0,S.slowT-dt);
  tickRepair();
  if(S.drone){S.drone.x+=S.drone.vx*(dt/1000);for(const m of S.drone.marks){const id=m.r+','+m.c;if(S.drone.hit[id]||!S.grid[m.r][m.c].alive)continue;const p=alienPos(m.r,m.c);if(S.drone.x>=p.x-4){S.drone.hit[id]=true;killAlien(m.r,m.c,true);S.fx.push({t:12,kind:'zap',x0:S.drone.x,y0:S.drone.y,x1:p.x+8,y1:p.y+6})}}if(S.drone.x>W+24)S.drone=null}
  if(S.homing&&S.homing.length){S.homing=S.homing.filter(m=>{if(m.wait>0){m.wait-=dt;return true}if(!S.grid[m.r]||!S.grid[m.r][m.c]||!S.grid[m.r][m.c].alive)return false;const p=alienPos(m.r,m.c),tx=p.x+AL_W/2,ty=p.y+AL_H/2,dx=tx-m.x,dy=ty-m.y,dist=Math.hypot(dx,dy)||1,step=220*(dt/1000);m.x+=dx/dist*step;m.y+=dy/dist*step;if(dist<8){killAlien(m.r,m.c,true);S.fx.push({t:10,kind:'pop',x:tx,y:ty});return false}return true})}
  if(S.nuke){S.nuke.t+=dt;S.nuke.x=S.px;if(S.nuke.phase==='rise'&&S.nuke.t>=280){S.nuke.phase='boom';S.nuke.t=0;detonateNuke()}else if(S.nuke.phase==='boom'&&S.nuke.t>=280)S.nuke=null}
  if(S.waveClear>0){S.waveClear--;if(S.waveClear===0){S.wave++;S.levert++;spawnWave(S.wave);S.bombs=[];S.bullets=[]}}
  else if(S.freezeT>0)S.moveAcc=0;
  else{S.moveAcc+=dt;const step=currentStepMs();if(S.moveAcc>=step){S.moveAcc-=step;stepFormation();if(S.over)return}if(S.hexWait>0)S.hexWait-=dt;S.bombAcc+=dt;if(S.bombAcc>=Math.max(280,S.n.bombEvery-S.wave*40)){S.bombAcc=0;if(S.flareT<=0)maybeBomb()}}
  S.fireAcc+=dt;const fireMs=S.clipT>0?S.n.fire*0.42:S.n.fire;if(S.fireAcc>=fireMs){S.fireAcc=0;if(!S.waveClear)fire()}
  maybeUfo(dt);
  for(const b of S.bullets)b.y+=b.vy*(dt/1000);
  S.bullets=S.bullets.filter(b=>{
    if(b.y<8)return false;
    let hitHex=false;
    S.bombs=S.bombs.filter(bom=>{if(!bom.hex)return true;if(Math.abs(b.x-bom.x)<12&&Math.abs(b.y-bom.y)<14){S.fx.push({t:10,kind:'pop',x:bom.x,y:bom.y});award(25);hitHex=true;return false}return true});
    if(hitHex)return b.pierce;
    if(S.ufo&&Math.abs(b.x-S.ufo.x)<14&&Math.abs(b.y-S.ufo.y)<7){award(100);spawnCrate(S.ufo.x,S.ufo.y+4);S.fx.push({t:12,kind:'pop',x:S.ufo.x,y:S.ufo.y});S.ufo=null;return b.pierce}
    for(const it of livingAliens()){const id=it.r+','+it.c;if(b.pierced.indexOf(id)>=0)continue;const p=alienPos(it.r,it.c);if(b.x>=p.x-1&&b.x<=p.x+AL_W+1&&b.y>=p.y&&b.y<=p.y+AL_H){killAlien(it.r,it.c,false);if(b.pierce){b.pierced.push(id);return true}return false}}
    if(!b.safe&&hitBunker(b.x,b.y,1.2))return false;
    return true;
  });
  const bombMul=S.slowT>0?0.35:1;
  for(const bom of S.bombs)bom.y+=bom.vy*bombMul*(dt/1000);
  S.bombs=S.bombs.filter(bom=>{
    if(!bom.hex && bom.y>=PLAYER_Y-8 && Math.abs(bom.x-S.px)<10){playerHit();return false}
    if(bom.y>=DEF_LINE){
      if(bom.hex)explodeHex(bom.x,DEF_LINE);
      return false;
    }
    if(bom.hex){for(const bk of S.bunkers){if(bom.x>bk.x-2&&bom.x<bk.x+bk.grid[0].length*bk.cell+2&&bom.y>bk.y-2&&bom.y<bk.y+bk.grid.length*bk.cell){explodeHex(bom.x,Math.min(bom.y,DEF_LINE));return false}}return true}
    if(hitBunker(bom.x,bom.y,2))return false;
    return true;
  });
  for(const c of S.crates){c.sway+=dt/220;c.x+=Math.sin(c.sway)*0.35;c.y+=c.vy*(dt/1000);if(Math.abs((c.x+5)-S.px)<22&&c.y>PLAYER_Y-22&&c.y<PLAYER_Y+14){givePerk(c.kind);c.dead=true;banner(PERK[c.kind].name,TIER[PERK[c.kind].tier].color)}}
  S.crates=S.crates.filter(c=>!c.dead&&c.y<H);S.fx=S.fx.filter(f=>--f.t>0);
}
function drawSprite(px,py,bits,w){w=w||11;for(let i=0;i<bits.length;i++){const row=bits[i];for(let x=0;x<w;x++)if(row&(1<<(w-1-x)))ctx.fillRect(px+x,py+i,1,1)}}
function alienBits(kind,frame){
  if(kind==='elite')return frame?[16,56,108,214,108,56,68,130]:[16,56,84,238,84,56,36,66];
  if(kind==='node')return frame?[16,56,124,254,124,56,16,16]:[0,16,56,124,56,16,16,56];
  if(kind==='wing')return frame?[1539,774,252,124,56,16,260,0]:[1025,1539,510,252,56,16,136,0];
  return frame?[124,260,626,762,626,260,124,16]:[56,396,514,626,514,396,56,0];
}
function drawTurret(px,py){const rec=S.recoil||0;ctx.fillStyle='#2a4030';ctx.fillRect(px-11,py+5,4,5);ctx.fillRect(px+7,py+5,4,5);ctx.fillStyle='#7CFF7C';ctx.fillRect(px-10,py+2,20,5);ctx.fillRect(px-7,py-2,14,5);ctx.fillStyle='#c8ffc8';ctx.fillRect(px-2,py-9-rec,4,8);ctx.fillRect(px-3,py-11-rec,6,3);if(S.wideT>0){ctx.fillStyle='#e8c15c';ctx.fillRect(px-22,py-6-rec,2,6);ctx.fillRect(px+20,py-6-rec,2,6)}}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.save();
  if(S&&S.shake>0)ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#7CFF7C';ctx.fillRect(0,DEF_LINE,W,2);
  ctx.fillStyle='#2a3a2a';for(let x=0;x<W;x+=6)ctx.fillRect(x,DEF_LINE+2,3,2);
  if(!S){ctx.restore();return}
  ctx.font='bold 10px "Courier New",monospace';ctx.textAlign='left';ctx.fillStyle='#c8ffc8';
  ctx.fillText('SCORE',8,12);ctx.fillText(String(S.score).padStart(4,'0'),8,24);
  ctx.textAlign='center';ctx.fillStyle='#6d8291';ctx.fillText('HI '+String(beste(S.mode)).padStart(4,'0'),W/2,12);
  ctx.fillStyle='#8aa3b5';ctx.fillText('WAVE '+S.wave+'  GAME '+S.mode,W/2,24);
  ctx.textAlign='right';ctx.fillStyle='#c8ffc8';ctx.fillText('LIVES',W-8,12);
  for(let i=0;i<S.lives;i++){ctx.fillStyle='#7CFF7C';ctx.fillRect(W-12-i*14,16,11,5);ctx.fillRect(W-8-i*14,13,3,4)}
  if(S.ufo){const x=Math.round(S.ufo.x),y=Math.round(S.ufo.y),on=Math.floor(Date.now()/140)%2===0;ctx.fillStyle='#5a7a68';ctx.fillRect(x-14,y,28,3);ctx.fillStyle='#9fd4b8';ctx.fillRect(x-10,y-3,20,3);ctx.fillRect(x-5,y-6,10,3);ctx.fillStyle='#d8ffe0';ctx.fillRect(x-2,y-4,4,2);ctx.fillStyle=on?'#7CFF7C':'#1a3a22';ctx.fillRect(x-13,y+1,3,2);ctx.fillRect(x+10,y+1,3,2);ctx.fillStyle=on?'#e8c15c':'#3a3010';ctx.fillRect(x-1,y+1,2,2)}
  if(S.drone){const x=Math.round(S.drone.x),y=Math.round(S.drone.y);ctx.fillStyle='#7fd4c8';ctx.fillRect(x-10,y-3,20,6);ctx.fillRect(x-4,y-6,8,3);ctx.fillRect(x-12,y-1,3,2);ctx.fillRect(x+9,y-1,3,2);ctx.fillStyle='#fff0a8';ctx.fillRect(x-2,y,4,2)}
  if(S.homing){for(const m of S.homing){if(m.wait>0)continue;ctx.fillStyle='#7fd4c8';ctx.beginPath();ctx.moveTo(m.x,m.y-5);ctx.lineTo(m.x+3,m.y+4);ctx.lineTo(m.x-3,m.y+4);ctx.fill()}}
  for(const b of S.bunkers){ctx.fillStyle='#7CFF7C';for(let gy=0;gy<b.grid.length;gy++)for(let gx=0;gx<b.grid[gy].length;gx++)if(b.grid[gy][gx])ctx.fillRect(b.x+gx*b.cell,b.y+gy*b.cell,b.cell,b.cell)}
  const fr=S.form.frame;
  for(const it of livingAliens()){const p=alienPos(it.r,it.c);ctx.fillStyle='#dceee0';if(it.a.kind==='wing')ctx.fillStyle='#9fd4a8';if(it.a.kind==='disc')ctx.fillStyle='#c8d4cc';if(it.a.kind==='elite')ctx.fillStyle=it.a.hp>1?'#e07ad6':'#f3b4ec';drawSprite(Math.round(p.x),Math.round(p.y),alienBits(it.a.kind,fr),11)}
  if(S.nuke&&S.nuke.phase==='rise'){const u=Math.min(1,S.nuke.t/280),y=S.nuke.y0+(S.nuke.y1-S.nuke.y0)*u;ctx.fillStyle='#ff6b5e';ctx.fillRect(S.nuke.x-2,y,4,S.nuke.y0-y);ctx.strokeStyle='rgba(255,179,71,0.5)';ctx.beginPath();ctx.arc(S.nuke.x,S.nuke.y1,S.nuke.r*u,0,7);ctx.stroke()}
  const hide=S.invuln>0&&Math.floor(S.invuln/3)%2===0;
  if(!hide){const px=Math.round(S.px);if(S.shield){ctx.strokeStyle='#9fd8e6';ctx.beginPath();ctx.arc(px,PLAYER_Y-2,16,0,7);ctx.stroke()}drawTurret(px,PLAYER_Y)}
  for(const b of S.bullets){ctx.fillStyle=b.safe?'#e8c15c':b.pierce?'#7fd4c8':'#fff';ctx.fillRect(Math.round(b.x),Math.round(b.y),b.pierce?2:1,b.pierce?10:6)}
  for(const bom of S.bombs){const x=Math.round(bom.x),y=Math.round(bom.y);if(bom.hex){const on=Math.floor(Date.now()/160)%2===0;ctx.fillStyle=on?'#ff3030':'#6d1010';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.strokeStyle=on?'#ffb3b3':'#c8412f';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.stroke()}else{ctx.fillStyle='#fff';ctx.fillRect(x,y,2,4)}}
  for(const c of S.crates){const col=TIER[PERK[c.kind].tier].color,cx=Math.round(c.x),cy=Math.round(c.y);ctx.fillStyle=col;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(cx+5,cy-4);ctx.lineTo(cx-6,cy-13);ctx.lineTo(cx+16,cy-13);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#5a4028';ctx.fillRect(cx-1,cy-1,12,9);ctx.fillStyle=col;ctx.fillRect(cx-2,cy+2,14,3)}
  for(const f of S.fx){
    if(f.kind==='pop'){ctx.fillStyle='#fff';ctx.fillRect(f.x-3,f.y,7,1);ctx.fillRect(f.x,f.y-3,1,7)}
    else if(f.kind==='spark'){ctx.fillStyle='#7CFF7C';ctx.fillRect(f.x,f.y,2,2)}
    else if(f.kind==='blast'){ctx.strokeStyle='#ffb347';ctx.globalAlpha=f.t/20;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.25-f.t/28),0,7);ctx.stroke();ctx.globalAlpha=1}
    else if(f.kind==='txt'){ctx.globalAlpha=Math.min(1,f.t/10);ctx.fillStyle=f.col;ctx.font='bold 12px "Courier New",monospace';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1}
    else if(f.kind==='frost'){ctx.fillStyle='rgba(159,216,230,'+(f.t/80)+')';ctx.fillRect(0,28,W,H-70)}
    else if(f.kind==='flare'){ctx.fillStyle='rgba(255,160,40,'+(f.t/70)+')';ctx.fillRect(0,28,W,18)}
    else if(f.kind==='zap'){ctx.strokeStyle='#e8c15c';ctx.beginPath();ctx.moveTo(f.x0,f.y0);ctx.lineTo(f.x1,f.y1);ctx.stroke()}
    else if(f.kind==='shatter'){ctx.strokeStyle='#9fd8e6';ctx.beginPath();ctx.arc(f.x,f.y,18,0,7);ctx.stroke()}
  }
  if(S.flash>0){ctx.fillStyle='rgba(255,200,80,'+(S.flash/18)+')';ctx.fillRect(0,0,W,H)}
  const boxY=H-22;
  if(S.perk){
    const col=TIER[PERK[S.perk].tier].color;
    ctx.fillStyle='#0b140d';ctx.fillRect(4,boxY,168,20);
    ctx.fillStyle=col;ctx.globalAlpha=0.28;ctx.fillRect(4,boxY,168,20);ctx.globalAlpha=1;
    ctx.fillRect(4,boxY,6,20);
    ctx.strokeStyle=col;ctx.strokeRect(4,boxY,168,20);
    ctx.fillStyle=col;ctx.font='bold 12px "Courier New",monospace';ctx.textAlign='left';
    ctx.fillText(PERK[S.perk].name,16,boxY+14);
    if(Math.floor(Date.now()/240)%2===0){ctx.fillStyle='#e8c15c';ctx.textAlign='right';ctx.fillText('SPECIAL',166,boxY+14)}
  } else {
    ctx.fillStyle='#0b140d';ctx.fillRect(4,boxY,168,20);
    ctx.strokeStyle='#2a3a30';ctx.strokeRect(4,boxY,168,20);
    ctx.fillStyle='#3a4a40';ctx.font='bold 10px "Courier New",monospace';ctx.textAlign='left';
    ctx.fillText('NO SPECIAL',16,boxY+14);
  }
  let extra='';
  if(S.pierceShots>0)extra+='P'+S.pierceShots+' ';
  if(S.wideT>0)extra+='WIDE ';
  if(S.freezeT>0)extra+='ICE ';
  if(S.drone)extra+='DRONE ';
  if(S.homing&&S.homing.length)extra+='LOCK ';
  if(S.flareT>0)extra+='JAM ';
  if(S.clipT>0)extra+='RAPID ';
  if(S.slowT>0)extra+='SLOW ';
  if(S.shield)extra+='SHLD ';
  if(S.nuke)extra+='NUKE ';
  if(extra){ctx.fillStyle='#7fd4c8';ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='right';ctx.fillText(extra.trim(),W-6,boxY-4)}
  if(S.waveClear>28){ctx.textAlign='center';ctx.fillStyle='#7CFF7C';ctx.font='bold 14px "Courier New",monospace';ctx.fillText('WAVE CLEAR',W/2,H/2)}
  ctx.restore();
  alarmLed.classList.toggle('lit',!!(S.perk||S.nuke||S.drone||S.shield||lowestY()>BUNKER_Y));
}
function planleggMeny(){if(!S||S.menyPlanlagt)return;S.menyPlanlagt=true;document.getElementById('menyTittel').textContent=S.arsak==='LANDED'?'OVERRUN':'GAME OVER';document.getElementById('menyTall').textContent='WAVE '+S.wave;document.getElementById('menyPoeng').textContent='SCORE '+String(S.score).padStart(4,'0');document.getElementById('menyRekord').textContent=S.nyRekord?'NEW HI '+S.score:'HI '+beste(S.mode);menyResultat.classList.add('vis');meny.classList.add('vis')}
function frame(t){if(crashed)return;try{if(!S){draw();requestAnimationFrame(frame);return}if(!S.last)S.last=t;let dt=t-S.last;S.last=t;if(dt>250)dt=16.7;else if(dt>66)dt=66;if(!S.over&&!S.paused)update(dt);if(S.over)planleggMeny();draw()}catch(e){crashed=true;errBox.style.display='block';errBox.textContent=String(e&&e.stack?e.stack:e)}requestAnimationFrame(frame)}
function bindHold(el,set){const on=ev=>{ev.preventDefault();set(true);el.classList.add('ned')};const off=ev=>{ev.preventDefault();set(false);el.classList.remove('ned')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}
bindHold(document.getElementById('left'),v=>keys.left=v);bindHold(document.getElementById('right'),v=>keys.right=v);
specialBtn.addEventListener('pointerdown',ev=>{ev.preventDefault();if(S&&S.perk)useSpecial()});

document.getElementById('btnHjem').addEventListener('click',()=>{
  try{ if(window.top!==window.self){ window.location.href=HJEM; return; } }catch(e){}
  S=null;menyResultat.classList.remove('vis');meny.classList.add('vis');updateSpecialClass();draw();
});
document.querySelectorAll('.valg').forEach(btn=>btn.addEventListener('click',()=>{reset(btn.getAttribute('data-mode'));menyResultat.classList.remove('vis')}));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();useSpecial()}});
