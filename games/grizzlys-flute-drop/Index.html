<!doctype html>
<html lang="en">
<!-- GRIZZLY'S FLUTE DROP | BUS ADVENTURES | SINGLE FILE PROTOTYPE -->
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Grizzly's Flute Drop • Bus Adventures</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--gold:#e8bd55;--red:#9d2630;--cream:#f1e4c2}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#39272b,#09080a 72%);color:#eee4d3;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:10px}
button{font:900 12px Arial,sans-serif;letter-spacing:1px;cursor:pointer;touch-action:manipulation;color:inherit}
#cab{width:min(500px,100%);align-self:flex-start;background:linear-gradient(135deg,#302a2d,#151316 65%);border:1px solid #66575d;border-radius:24px;padding:12px;box-shadow:0 20px 70px #000,inset 0 0 0 4px #211c20}
.brand{display:flex;justify-content:space-between;padding:3px 5px 10px;color:#b9aeb1;font-size:9px;font-weight:800;letter-spacing:2px}
.top{display:flex;align-items:center;gap:9px;margin-bottom:8px}.top b{flex:1;text-align:center;font-size:15px;letter-spacing:2px;color:#f1d58e}.top button{background:#281f23;border:1px solid #604c55;border-radius:8px;padding:9px}
#screen{position:relative;border:6px solid #070608;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px #6a555e}
canvas{display:block;width:100%;height:auto;background:#111}
#overlay{position:absolute;inset:0;background:radial-gradient(ellipse at top,#38262ef7,#110e12fa 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#overlay.hide{display:none}.eyebrow{font-size:9px;letter-spacing:2px;color:#d8b763}.title{font-size:clamp(25px,7vw,39px);line-height:.95;margin:12px 0;color:#f1d58e;text-shadow:0 3px #5f3028;font-weight:1000}.copy{max-width:350px;font-size:12px;line-height:1.55;color:#ddd0cc;margin:7px 0 17px}.start{padding:14px 20px;background:#d3ad50;color:#241b1e;border:1px solid #ffe49a;border-radius:8px;box-shadow:0 5px #725025}
.deck{padding:13px 3px 3px}.meter{height:9px;background:#0d0b0d;border:1px solid #54444b;border-radius:5px;overflow:hidden;margin-bottom:12px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c2029,#e1b94f)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.act{height:74px;border-radius:17px;border:2px solid #71636a;box-shadow:0 6px #080708;font-size:16px}.save{background:linear-gradient(#536f67,#283b37)}.smash{background:linear-gradient(#9b3a3a,#512126)}.act small{display:block;font-size:8px;letter-spacing:2px;margin-top:5px;opacity:.72}.act:active,.act.down{transform:translateY(4px);box-shadow:0 2px #080708}.act:disabled{opacity:.45}
.foot{text-align:center;margin-top:13px;color:#8f8186;font-size:8px;letter-spacing:1.2px}
@media(max-width:390px){body{padding:4px}#cab{padding:7px;border-radius:15px}.brand{padding-bottom:5px}.top{margin-bottom:5px}.top b{font-size:12px}.act{height:62px}.deck{padding-top:8px}}
</style></head>
<body><main id="cab">
<div class="brand"><span>BUS ADVENTURES</span><span>POCKET ARCADE / GRIZZLY</span></div>
<div class="top"><button id="home">HOME</button><b>GRIZZLY'S FLUTE DROP</b><button id="menu">MENU</button></div>
<div id="screen"><canvas id="c" width="420" height="520"></canvas>
<div id="overlay"><div class="eyebrow" id="eye">A TRUE-ISH GRIZZLY STORY</div><div class="title" id="ttl">GRIZZLY'S<br>FLUTE DROP</div><div class="copy" id="cpy">Wrestling showman. Conference host. Flutist.<br><br>Tonight, one instrument is supposed to hit the floor.<br><b>Just make sure it's the right one.</b></div><button class="start" id="start">ENTER REHEARSAL</button></div></div>
<div class="deck"><div class="meter"><i id="meter"></i></div><div class="controls"><button class="act save" id="save">SAVE<small>← / A</small></button><button class="act smash" id="smash">SMASH<small>→ / D</small></button></div><div class="foot">PROTECT THE MUSIC • COMMIT TO THE BIT</div></div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s),c=$('#c'),g=c.getContext('2d'),W=420,H=520;
let state='menu',phase=0,score=0,combo=0,meter=0,time=0,last=performance.now(),round=0,item=null,deadline=0,msg='',msgT=0,flash=0;
let particles=[],crowd=[],drop=null,storyT=0,finaleT=0;
const items=[
 {name:'REHEARSAL FLUTE',kind:'smash',mark:'REHEARSAL',col:'#c6cbd0'},
 {name:'PICCOLO',kind:'save',mark:'PICCOLO',col:'#d9d9d4'},
 {name:'MICROPHONE',kind:'save',mark:'MIC',col:'#555'},
 {name:'PROP FLUTE',kind:'smash',mark:'PROP',col:'#aeb8bc'},
 {name:'WRESTLING BELT',kind:'save',mark:'CHAMP',col:'#d0a63f'},
 {name:'PRACTICE FLUTE',kind:'smash',mark:'PRACTICE',col:'#c4c8c9'},
 {name:'CONDUCTOR BATON',kind:'save',mark:'BATON',col:'#eee1ba'}
];
function R(x,y,w,h,z){g.fillStyle=z;g.fillRect(x,y,w,h)}
function T(t,x,y,s,z='#fff',a='center'){g.fillStyle=z;g.font='900 '+s+'px Arial';g.textAlign=a;g.fillText(t,x,y)}
function line(x,y,x2,y2,z,w=2){g.strokeStyle=z;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function ellipse(x,y,rx,ry,z){g.fillStyle=z;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function announce(s,d=1.25){msg=s;msgT=d}
function resetCrowd(){crowd=Array.from({length:34},(_,i)=>({x:8+(i%17)*25,y:105+Math.floor(i/17)*25,p:Math.random()*6.2}))}
resetCrowd();
function background(){
 let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,phase<2?'#332b31':'#271420');grad.addColorStop(.5,'#111014');grad.addColorStop(1,'#09080a');g.fillStyle=grad;g.fillRect(0,0,W,H);
 // rigging / spotlights
 R(0,0,W,52,'#08080a');for(let x=18;x<W;x+=48){R(x,17,22,8,'#333');line(x+11,25,210,200,phase>=2?'#d8b45b22':'#ddd8c418',9)}
 T(phase===1?'GENERAL REHEARSAL':phase===2?'TONIGHT: LIVE PERFORMANCE':phase===3?'THE MOMENT':'GRIZZLY',210,33,11,'#d6b861');
 // audience
 for(const q of crowd){let bounce=(phase>=2?Math.sin(time*7+q.p)*3:0);ellipse(q.x,q.y+bounce,8,10,'#29232a');ellipse(q.x,q.y-10+bounce,5,5,'#b38e7b')}
 // ring
 R(25,360,370,115,'#dad7ce');R(25,465,370,17,'#8d1f29');for(let y of [330,350,370])line(18,y,402,y,'#9b2730',4);
 for(let x of [23,397]){R(x-5,310,10,171,'#272329');for(let y of [330,350,370])ellipse(x,y,8,6,'#b52d38')}
 T('GRIZZLY',210,458,22,'#262126');
}
function grizzly(){
 const x=210,y=305,bob=phase>=2?Math.sin(time*4)*1.5:0;
 // respectful stylized showman, broad silhouette / beard / dark shirt
 ellipse(x,y+58,42,10,'#0005');R(x-31,y+8+bob,62,68,'#18191c');
 R(x-38,y+20+bob,10,48,'#d5ad92');R(x+28,y+20+bob,10,48,'#d5ad92');
 ellipse(x,y-5+bob,27,31,'#d5ad92');R(x-24,y-22+bob,48,12,'#6c5546');
 // beard
 g.fillStyle='#5b4438';g.beginPath();g.moveTo(x-24,y+1+bob);g.quadraticCurveTo(x,y+42+bob,x+24,y+1+bob);g.lineTo(x+18,y+22+bob);g.quadraticCurveTo(x,y+34+bob,x-18,y+22+bob);g.closePath();g.fill();
 ellipse(x-9,y-8+bob,2,2,'#191617');ellipse(x+9,y-8+bob,2,2,'#191617');R(x-7,y+7+bob,14,2,'#e5c0a6');
 T('GRIZZLY',x,y+42+bob,9,'#e7c458');
}
function flute(x,y,rot=0,concert=false,label=''){
 g.save();g.translate(x,y);g.rotate(rot);
 line(-70,0,70,0,concert?'#f4f5f5':'#c6cbcd',7);line(-66,-2,66,-2,'#fff9',1);
 ellipse(-57,0,7,7,'#dfe3e4');for(let i=-35;i<55;i+=18){ellipse(i,0,5,5,'#eef1f1');ellipse(i,0,2,2,'#777')}
 if(concert){R(-20,-14,40,8,'#7d1f29');T('CONCERT',0,-8,7,'#fff')}
 if(label)T(label,0,18,7,'#e7d3a1');
 g.restore();
}
function objectDraw(it){
 if(!it)return;
 let x=210,y=220;
 if(it.name.includes('FLUTE'))flute(x,y,0,false,it.mark);
 else if(it.name==='PICCOLO'){g.save();g.translate(x,y);g.scale(.65,.65);flute(0,0,0,false,'PICCOLO');g.restore()}
 else if(it.name==='MICROPHONE'){line(x,y-35,x,y+45,'#777',9);ellipse(x,y-43,14,18,'#333');for(let i=-7;i<8;i+=5)line(x+i,y-53,x+i,y-34,'#888',1);T('MIC',x,y+65,8,'#d8c68f')}
 else if(it.name==='WRESTLING BELT'){R(x-80,y-15,160,30,'#4b2920');ellipse(x,y,38,25,'#d4ad45');T('GRIZZLY',x,y+4,10,'#3a2913')}
 else {line(x,y-45,x,y+45,'#eee1ba',5);T('BATON',x,y+62,8,'#d8c68f')}
}
function hud(){
 T('SCORE '+score,15,72,11,'#eee0bd','left');T('COMBO x'+combo,W-15,72,11,'#eee0bd','right');
 if(phase===1||phase===2){let left=Math.max(0,deadline-time);R(110,82,200,5,'#302b2e');R(110,82,200*Math.min(1,left/(phase===1?2.6:1.75)),5,left<.45?'#b63238':'#d7b554')}
 if(msgT>0){R(40,120,340,42,'#0b090bdc');T(msg,210,147,msg.length>27?13:17,msg.includes('WRONG')?'#ff7770':'#f0d06f')}
}
function draw(){
 background();grizzly();
 if(state==='play'&&(phase===1||phase===2))objectDraw(item);
 if(drop){flute(drop.x,drop.y,drop.r,true);if(drop.reveal)T('WAIT — THAT IS THE CONCERT FLUTE!',210,188,15,'#ffdb72')}
 for(const p of particles){g.globalAlpha=Math.max(0,p.life);T(p.t,p.x,p.y,p.s,p.c);g.globalAlpha=1}
 hud();
 if(phase===3&&storyT>0){
   let a=Math.min(1,storyT/.4);g.fillStyle=`rgba(0,0,0,${.35*a})`;g.fillRect(0,0,W,H);
 }
 if(phase===4){
   T('IT SURVIVED.',210,205,30,'#f1d36f');
   T('OF COURSE IT DID.',210,235,12,'#ddd1c6');
   if(finaleT>2.2)T('GRIZZ-LY!  GRIZZ-LY!  GRIZZ-LY!',210,275,13,'#fff');
 }
 if(flash>0){g.fillStyle=`rgba(255,235,190,${flash})`;g.fillRect(0,0,W,H)}
 $('#meter').style.width=Math.min(100,meter)+'%';
 let enabled=state==='play'&&(phase===1||phase===2);
 $('#save').disabled=$('#smash').disabled=!enabled;
}
function nextItem(){
 round++;
 let pool=items;
 item=pool[Math.floor(Math.random()*pool.length)];
 // teach smash reflex early and repeatedly
 if(phase===1&&round===1)item=items[0];
 if(phase===1&&round===2)item=items[3];
 if(phase===1&&round===3)item=items[1];
 if(phase===2&&round===1)item=items[5];
 deadline=time+(phase===1?2.6:Math.max(.72,1.65-round*.055));
}
function decision(which){
 if(state!=='play'||!(phase===1||phase===2)||!item)return;
 let good=which===item.kind;
 if(good){score+=100+combo*20;combo++;meter=Math.min(100,meter+12);announce(which==='smash'?['FLUTE SLAM!','COMMIT TO THE BIT!','CLEAN DROP!'][round%3]:'PROTECTED!',.7);
   if(which==='smash')burst('SMASH!',210,220);
 }else{combo=0;meter=Math.max(0,meter-18);announce(which==='smash'?'NOT THAT ONE!':'THE BIT DEMANDS COMMITMENT!',1)}
 item=null;
 if(phase===1&&round>=6){setTimeout(()=>beginShow(),500);return}
 if(phase===2&&round>=9){setTimeout(()=>historicMoment(),500);return}
 setTimeout(()=>{if(state==='play'&&(phase===1||phase===2))nextItem()},300);
}
function burst(t,x,y){for(let i=0;i<14;i++){let a=Math.PI*2*i/14;particles.push({t:i%3?'✦':t,x,y,vx:Math.cos(a)*(30+Math.random()*80),vy:Math.sin(a)*(30+Math.random()*80)-25,life:.8,s:i%3?10:12,c:i%2?'#e7bd55':'#fff'})}}
function beginShow(){phase=2;round=0;combo=0;announce('TONIGHT: LIVE PERFORMANCE',1.8);setTimeout(()=>{if(state==='play'&&phase===2)nextItem()},1100)}
function historicMoment(){
 phase=3;item=null;storyT=.01;announce('',0);
 drop={x:210,y:218,r:0,vy:0,reveal:false,hit:false};
 // the game performs the trained action: the player has been conditioned to commit
 setTimeout(()=>{if(drop)drop.reveal=true},650);
}
function finale(){phase=4;drop=null;finaleT=0;meter=100;score+=1000;burst('!',210,245)}
function update(dt){
 time+=dt;msgT=Math.max(0,msgT-dt);flash=Math.max(0,flash-dt);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
 if(state==='play'&&(phase===1||phase===2)&&item&&time>deadline){combo=0;meter=Math.max(0,meter-10);announce('TOO SLOW!',.7);item=null;setTimeout(()=>{if(state==='play'&&(phase===1||phase===2))nextItem()},250)}
 if(phase===3&&drop){
   storyT+=dt;
   if(storyT>.45){drop.vy+=480*dt;drop.y+=drop.vy*dt;drop.r+=dt*5.4}
   if(drop.y>405&&!drop.hit){drop.hit=true;drop.y=405;drop.vy=-55;flash=.5;announce('KLONK.',1.5);setTimeout(finale,1450)}
 }
 if(phase===4)finaleT+=dt;
}
function start(){
 state='play';phase=1;score=combo=meter=time=round=0;item=null;drop=null;storyT=finaleT=0;particles=[];$('#overlay').classList.add('hide');announce('GENERAL REHEARSAL',1.5);setTimeout(()=>{if(state==='play')nextItem()},900)
}
function menu(){
 state='menu';phase=0;item=drop=null;$('#eye').textContent='A TRUE-ISH GRIZZLY STORY';$('#ttl').innerHTML="GRIZZLY'S<br>FLUTE DROP";$('#cpy').innerHTML='Wrestling showman. Conference host. Flutist.<br><br>Tonight, one instrument is supposed to hit the floor.<br><b>Just make sure it\\'s the right one.</b>';$('#start').textContent='ENTER REHEARSAL';$('#overlay').classList.remove('hide')
}
$('#start').onclick=start;$('#menu').onclick=menu;$('#home').onclick=()=>location.href=new URL('../../index.html',location.href).href;
function bind(btn,which){btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('down')});for(const ev of ['pointerup','pointercancel','pointerleave'])btn.addEventListener(ev,e=>{btn.classList.remove('down');if(ev==='pointerup')decision(which)})}
bind($('#save'),'save');bind($('#smash'),'smash');
addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowLeft','KeyA'].includes(e.code))decision('save');if(['ArrowRight','KeyD','Space'].includes(e.code))decision('smash');if(e.code==='Escape')menu()});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
function loop(n){let dt=Math.min(.035,(n-last)/1000||0);last=n;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
