<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Adventures — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset & variables ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #0e0f12;
  --surface:  #16181e;
  --surface2: #1e2028;
  --surface3: #272a34;
  --line:     #2e3140;
  --line2:    #3a3e50;
  --text:     #d8dae8;
  --muted:    #6b7090;
  --accent:   #5b7cf6;
  --accent2:  #7c9aff;
  --green:    #4caf7d;
  --red:      #e05555;
  --amber:    #e0a840;
  --font:     'IBM Plex Sans', sans-serif;
  --mono:     'IBM Plex Mono', monospace;
  --radius:   8px;
  --nav-w:    220px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}

/* ── Layout ─────────────────────────────────────────────────────── */
.layout{display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:44px 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:10}
.nav{grid-row:2;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.main{grid-row:2;overflow-y:auto;padding:24px}

/* ── Topbar ─────────────────────────────────────────────────────── */
.logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent2);letter-spacing:.06em}
.logo span{color:var(--muted)}
.topbar-title{font-size:13px;color:var(--muted);flex:1}
.topbar-title strong{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--surface2);color:var(--text);font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--surface3);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(224,85,85,.12)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.icon-btn{padding:6px;width:28px;height:28px;justify-content:center}

/* ── Nav ────────────────────────────────────────────────────────── */
.nav-section{padding:10px 0}
.nav-section+.nav-section{border-top:1px solid var(--line)}
.nav-label{padding:4px 14px;font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;cursor:pointer;border-radius:0;transition:.1s;font-size:13px;gap:8px}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--surface3);color:var(--accent2)}
.nav-item .nav-icon{font-size:15px;flex-shrink:0}
.nav-item .nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
.nav-add{display:flex;align-items:center;gap:6px;padding:6px 14px;color:var(--accent);font-size:12px;cursor:pointer;opacity:.7}
.nav-add:hover{opacity:1}

/* ── Panel / form ───────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.panel-head h2{font-size:14px;font-weight:600;letter-spacing:.02em}
.panel-head .actions{display:flex;gap:8px}
.panel-body{padding:16px}
.panel-body.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel-body.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── Form fields ────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);font-family:var(--mono)}
input,textarea,select{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;color:var(--text);font:inherit;font-size:13px;padding:8px 10px;width:100%;transition:.15s;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;font-family:var(--mono);font-size:12px;line-height:1.6}
select option{background:var(--surface2)}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}

/* ── Tags ───────────────────────────────────────────────────────── */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:var(--surface2);border:1px solid var(--line2);border-radius:6px;cursor:text;min-height:38px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--accent)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface3);border:1px solid var(--line2);border-radius:4px;padding:2px 8px;font-size:12px;font-family:var(--mono)}
.tag-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0}
.tag-chip button:hover{color:var(--red)}
.tag-bare-input{background:none;border:none;outline:none;font:inherit;font-size:12px;font-family:var(--mono);color:var(--text);min-width:80px;padding:0}

/* ── List items (exits, actions, etc.) ──────────────────────────── */
.list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.list-item .handle{color:var(--muted);font-size:16px;padding-top:2px;flex-shrink:0;cursor:grab}
.list-item .fields{flex:1;display:grid;gap:8px}
.list-item .fields.g2{grid-template-columns:1fr 1fr}
.list-item .fields.g3{grid-template-columns:1fr 1fr 1fr}
.list-item .remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px;flex-shrink:0}
.list-item .remove-btn:hover{color:var(--red)}
.add-row{display:flex;align-items:center;gap:8px;padding:8px 0 4px;color:var(--accent);font-size:12px;cursor:pointer;opacity:.7;width:fit-content}
.add-row:hover{opacity:1}

/* ── Condition / effect builder ─────────────────────────────────── */
.cond-block,.effect-block{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.cond-block h4,.effect-block h4{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cond-row,.effect-row{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.cond-row select,.effect-row select{padding:5px 8px;font-size:12px}
.cond-row input,.effect-row input{padding:5px 8px;font-size:12px}

/* ── Hazard / state sections ────────────────────────────────────── */
.state-tab-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.state-tab{padding:5px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surface2);font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--muted)}
.state-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Map grid ───────────────────────────────────────────────────── */
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:480px}
.map-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;cursor:pointer;transition:.15s;color:var(--muted);gap:2px}
.map-cell.occupied{background:var(--surface3);border-color:var(--line2);color:var(--text)}
.map-cell.occupied:hover{border-color:var(--accent)}
.map-cell.active-cell{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,124,246,.3)}
.map-cell .cell-id{font-family:var(--mono);font-size:9px;color:var(--muted)}

/* ── Empty state ────────────────────────────────────────────────── */
.empty-state{text-align:center;padding:40px;color:var(--muted)}
.empty-state h3{font-size:16px;color:var(--text);margin-bottom:8px}

/* ── Status bar ─────────────────────────────────────────────────── */
.status-bar{position:fixed;bottom:0;left:var(--nav-w);right:0;padding:6px 16px;background:var(--surface);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:16px;z-index:10}
.status-ok{color:var(--green)}
.status-err{color:var(--red)}
.status-warn{color:var(--amber)}

/* ── Inline expand ──────────────────────────────────────────────── */
.expandable summary{cursor:pointer;user-select:none;font-size:12px;color:var(--accent);margin-bottom:6px;list-style:none}
.expandable summary::before{content:"▶ ";font-size:10px}
details[open] summary::before{content:"▼ "}

/* ── Section divider ────────────────────────────────────────────── */
.section-divider{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 0;margin:16px 0 8px;border-top:1px solid var(--line)}

/* ── Toast ──────────────────────────────────────────────────────── */
.toast{position:fixed;top:54px;right:16px;background:var(--surface3);border:1px solid var(--line2);border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:100;animation:fadeup .2s ease;pointer-events:none}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="layout">

<!-- ── Topbar ── -->
<header class="topbar">
  <div class="logo">BUS<span>/</span>EDITOR</div>
  <div class="topbar-title" id="topTitle">No game loaded</div>
  <button class="btn sm" id="btnLoad">Load game.js</button>
  <button class="btn sm primary" id="btnExport">Export JS files</button>
</header>

<!-- ── Nav ── -->
<nav class="nav">
  <div class="nav-section">
    <div class="nav-label">Game</div>
    <div class="nav-item" data-view="game"><span class="nav-icon">⚙</span><span class="nav-text">Settings</span></div>
    <div class="nav-item" data-view="map"><span class="nav-icon">⬜</span><span class="nav-text">Room Map</span></div>
  </div>
  <div class="nav-section" style="flex:1;overflow-y:auto">
    <div class="nav-label">Rooms</div>
    <div id="navRooms"></div>
    <div class="nav-add" id="btnAddRoom">＋ Add Room</div>
  </div>
  <div class="nav-section" style="max-height:35%;overflow-y:auto">
    <div class="nav-label">Items</div>
    <div id="navItems"></div>
    <div class="nav-add" id="btnAddItem">＋ Add Item</div>
  </div>
</nav>

<!-- ── Main ── -->
<main class="main" id="mainArea">
  <div class="empty-state">
    <h3>Bus Adventures Editor</h3>
    <p>Load your game files or start with a template.</p>
    <br>
    <button class="btn primary" id="btnLoadTemplate">Load Ward B template</button>
  </div>
</main>

</div>

<div class="status-bar">
  <span id="statusMsg" class="status-ok">Ready</span>
  <span id="statusRooms">0 rooms</span>
  <span id="statusItems">0 items</span>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════

const STATE = {
  game:  { id:"my-game", title:"My Game", startRoom:"", intro:{title:"",subtitle:"",text:"",startLabel:"Begin"}, win:{title:"",text:"",playAgainLabel:"Play again"} },
  rooms: {},
  items: {},
  currentView: null,
  currentRoom: null,
  currentItem: null,
};

// ══════════════════════════════════════════════════════════════════
// WARD B BOOTSTRAP DATA
// ══════════════════════════════════════════════════════════════════

      baseDescription:"A long corridor. Glass panels look into dark rooms. Handprints on the inside of the glass.\n\nSurgery west. Courtyard south.",
      itemText:{}, exits:{ west:"surgery", south:"courtyard" }, states:{}, hazards:[], actions:[], enterRules:[],

  refreshAll();
  toast("Ward B loaded");
}

// ══════════════════════════════════════════════════════════════════
// UI HELPERS

function el(id){ return document.getElementById(id); }
function make(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}

function toast(msg, type="ok"){
  const t=make("div","toast");
  t.style.borderColor=type==="err"?"var(--red)":type==="warn"?"var(--amber)":"var(--green)";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

function setStatus(msg, type="ok"){
  const s=el("statusMsg");
  s.textContent=msg;
  s.className="status-"+type;
}

function refreshStatus(){
  el("statusRooms").textContent=Object.keys(STATE.rooms).length+" rooms";
  el("statusItems").textContent=Object.keys(STATE.items).length+" items";
}

// ── Tag input widget ──────────────────────────────────────────────
function makeTagInput(tags, onChange){
  const wrap=make("div","tag-input-wrap");
  const inp=make("input","tag-bare-input");
  inp.placeholder="add tag…";

  function render(){
    wrap.innerHTML="";
    tags.forEach((t,i)=>{
      const chip=make("div","tag-chip");
      chip.innerHTML=`${t}<button data-i="${i}">×</button>`;
      chip.querySelector("button").onclick=()=>{ tags.splice(i,1); render(); onChange(tags); };
      wrap.appendChild(chip);
    });
    wrap.appendChild(inp);
  }

  inp.onkeydown=(e)=>{
    if((e.key==="Enter"||e.key===","||e.key===" ")&&inp.value.trim()){
      e.preventDefault();
      const v=inp.value.trim().replace(/,$/,"");
      if(v&&!tags.includes(v)){ tags.push(v); onChange(tags); }
      inp.value="";
      render();
    }
    if(e.key==="Backspace"&&!inp.value&&tags.length){
      tags.pop(); render(); onChange(tags);
    }
  };

  render();
  return wrap;
}

function refreshNav(){
  const navR=el("navRooms"); navR.innerHTML="";
  Object.entries(STATE.rooms).forEach(([id,r])=>{
    const d=make("div","nav-item");
    d.dataset.roomId=id;
    d.innerHTML=`<span class="nav-icon">🚪</span><span class="nav-text">${r.title||id}</span><span class="nav-badge">${id}</span>`;
    d.onclick=()=>showRoom(id);
    navR.appendChild(d);
  });

  const navI=el("navItems"); navI.innerHTML="";
  Object.entries(STATE.items).forEach(([id,it])=>{
    const d=make("div","nav-item");
    d.dataset.itemId=id;
    d.innerHTML=`<span class="nav-icon">🎒</span><span class="nav-text">${it.name||id}</span>`;
    d.onclick=()=>showItem(id);
    navI.appendChild(d);
  });

  refreshStatus();
  el("topTitle").innerHTML=STATE.game.title ? `<strong>${STATE.game.title}</strong>` : "No game loaded";
}

function setActiveNav(selector){
  document.querySelectorAll(".nav-item.active").forEach(e=>e.classList.remove("active"));
  const el2=document.querySelector(selector);
  if(el2) el2.classList.add("active");
}

// ── Map ───────────────────────────────────────────────────────────
function showMap(){
  setActiveNav('[data-view="map"]');
  const grid=make("div","map-grid");
  for(let row=0;row<4;row++){
    for(let col=0;col<4;col++){
      const roomId=Object.keys(STATE.rooms).find(id=>{
        const p=STATE.rooms[id].gridPosition;
        return p&&p.col===col&&p.row===row;
      });
      const cell=make("div","map-cell");
      if(roomId){
        cell.classList.add("occupied");
        if(roomId===STATE.currentRoom) cell.classList.add("active-cell");
        const r=STATE.rooms[roomId];
        cell.innerHTML=`<span>${r.title}</span><span class="cell-id">${roomId}</span>`;
        cell.onclick=()=>showRoom(roomId);
      } else {
        cell.textContent=`${col},${row}`;
        cell.style.opacity=".3";
      }
      grid.appendChild(cell);
    }
  }
  el("mainArea").innerHTML="<h2 style='margin-bottom:16px;font-size:16px'>Room Map</h2>";
  el("mainArea").appendChild(grid);
}

function showRoom(id){

    <h2 style="font-size:16px">${r.title||id} <span style="font-size:12px;color:var(--muted);font-family:var(--mono)">${id}</span></h2>

    <div class="panel-head"><h2>Room Details</h2></div>
    <div class="panel-body grid2">
      <div class="field"><label>Room ID</label><input id="rId" value="${id}"></div>
      <div class="field"><label>Title</label><input id="rTitle" value="${r.title||""}"></div>
      <div class="field"><label>Media key</label><input id="rMedia" value="${r.media||""}"></div>
      <div class="field"><label>FX</label>

          <option value="flicker" ${r.fx==="flicker"?"selected":""}>flicker</option>
        </select>
      </div>
      <div class="field"><label>Grid col</label><input id="rCol" type="number" value="${r.gridPosition?.col??0}"></div>
      <div class="field"><label>Grid row</label><input id="rRow" type="number" value="${r.gridPosition?.row??0}"></div>
      <div class="field full checkbox-row"><input type="checkbox" id="rWin" ${r.win?"checked":""}><label for="rWin">Win room (entering = victory)</label></div>
    </div>
  </div>

  <!-- Description -->
  <div class="panel">
    <div class="panel-head"><h2>Description</h2></div>
    <div class="panel-body">
      ${hasStates ? `
      <div class="section-divider">Room States</div>
      <div class="state-tab-row" id="stateTabRow">
        ${stateKeys.map((s,i)=>`<div class="state-tab ${i===0?"active":""}" data-state="${s}">${s}</div>`).join("")}

      </div>
      ${stateKeys.map((s,i)=>`
      <div class="state-panel" data-state-panel="${s}" style="${i>0?"display:none":""}">
        <div class="field" style="margin-bottom:8px">
          <label>State name</label>
          <input class="state-name-inp" data-state="${s}" value="${s}">
        </div>
        <div class="field" style="margin-bottom:8px">
          <label>Description</label>
          <textarea class="state-desc-ta" data-state="${s}" rows="4">${r.states[s].description||""}</textarea>
        </div>
        <div class="field">
          <label>FX override</label>
          <select class="state-fx-sel" data-state="${s}">
            <option value="">none</option>
            <option value="mist" ${r.states[s].fx==="mist"?"selected":""}>mist</option>
            <option value="flicker" ${r.states[s].fx==="flicker"?"selected":""}>flicker</option>

      <button class="btn sm" id="addStateBtn" style="margin-top:8px">＋ Add room states</button>

  </div>

  <!-- Actions -->

    <div class="panel-head"><h2>Room Actions</h2><div class="actions"><button class="btn sm" id="addAction">＋ Add action</button></div></div>

    showRoom(id);

    showRoom(id);
  };

  el("saveRoom").onclick=()=>saveRoom(id);

function renderExitsList(exits){
  return Object.entries(exits).map(([dir,def])=>{
    const to   = typeof def==="string" ? def : (def.to||"");
    const cond = typeof def==="string" ? "" : JSON.stringify(def.condition||"");
    const locked=typeof def==="string" ? "" : (def.lockedText||"");
    const special=typeof def!=="string"&&def.special ? "checked" : "";
    const hidden=typeof def!=="string"&&def.hidden ? "checked" : "";
    return `<div class="list-item" data-exit-dir="${esc(dir)}">
      <div class="fields g3">
        <div class="field"><label>Direction</label><input class="exit-dir" value="${esc(dir)}"></div>
        <div class="field"><label>Target room</label><input class="exit-to" value="${esc(to)}"></div>
        <div class="field"><label>Locked text</label><input class="exit-locked" value="${esc(locked)}"></div>
        <div class="field full"><label>Condition (JSON)</label><input class="exit-cond" value="${esc(cond)}" placeholder='{ "flag": "patientCalmed" }'></div>
        <div class="checkbox-row"><input type="checkbox" class="exit-special" ${special}><label>Special (no button)</label></div>
        <div class="checkbox-row"><input type="checkbox" class="exit-hidden" ${hidden}><label>Hidden until condition</label></div>
      </div>
      <button class="remove-btn" onclick="this.closest('.list-item').remove()">×</button>
    </div>`;
  }).join("")||"<p style='color:var(--muted);font-size:13px'>No exits.</p>";
}

function renderActionsList(actions){
  return (actions||[]).map((a,i)=>`
  <div class="list-item" data-action-i="${i}">
    <div class="fields">
      <div class="fields g2">
        <div class="field"><label>ID</label><input class="a-id" value="${esc(a.id||"")}"></div>
        <div class="field"><label>Verbs (comma separated)</label><input class="a-verbs" value="${esc((a.verbs||[]).join(","))}"></div>
        <div class="field"><label>Targets (comma separated)</label><input class="a-targets" value="${esc((a.targets||a.target||[]).join(","))}"></div>
        <div class="field"><label>Requires (JSON)</label><input class="a-req" value="${esc(JSON.stringify(a.requires||""))}" placeholder='{ "heldTag":"pry_tool" }'></div>
      </div>
      <div class="field"><label>Success text</label><textarea class="a-ok" rows="2">${esc(a.successText||a.text||"")}</textarea></div>
      <div class="field"><label>Fail text</label><input class="a-fail" value="${esc(a.failText||"")}"></div>
      <div class="field"><label>Effects (JSON)</label><textarea class="a-fx" rows="2">${esc(JSON.stringify(a.effects||{}))}</textarea></div>
    </div>
    <button class="remove-btn" onclick="this.closest('.list-item').remove()">×</button>
  </div>`).join("")||"<p style='color:var(--muted);font-size:13px'>No actions.</p>";
}

  return Object.entries(objs).map(([key,o])=>`

function saveRoom(oldId){
  const r=STATE.rooms[oldId];
  const newId=el("rId").value.trim()||oldId;

  // Basic
  r.title   = el("rTitle").value.trim();
  r.media   = el("rMedia").value.trim();
  r.fx      = el("rFx").value||null;
  r.win     = el("rWin").checked||undefined;
  r.gridPosition={ col:parseInt(el("rCol").value)||0, row:parseInt(el("rRow").value)||0 };

  // Description / states
  const descEl=el("rDesc");
  if(descEl) r.baseDescription=descEl.value;
  document.querySelectorAll("[data-state-panel]").forEach(panel=>{
    const s=panel.dataset.statePanel;
    if(!r.states) r.states={};
    const descTa=panel.querySelector(".state-desc-ta");
    const fxSel=panel.querySelector(".state-fx-sel");
    if(descTa) r.states[s]={ description:descTa.value, fx:fxSel?.value||null };
  });

  // Exits
  r.exits={};
  document.querySelectorAll("#exitsList .list-item").forEach(row=>{
    const dir  = row.querySelector(".exit-dir").value.trim();
    const to   = row.querySelector(".exit-to").value.trim();
    const locked=row.querySelector(".exit-locked").value.trim();
    const condStr=row.querySelector(".exit-cond").value.trim();
    const special=row.querySelector(".exit-special").checked;
    const hidden=row.querySelector(".exit-hidden").checked;
    if(!dir) return;
    if(!locked&&!condStr&&!special&&!hidden){ r.exits[dir]=to; return; }
    const def={ to };
    if(locked)  def.lockedText=locked;
    if(special) def.special=true;
    if(hidden)  def.hidden=true;
    if(condStr) try{ def.condition=JSON.parse(condStr); }catch{}
    r.exits[dir]=def;
  });

  // Actions
  r.actions=[];
  document.querySelectorAll("#actionsList .list-item").forEach(row=>{
    const id2=row.querySelector(".a-id").value.trim();
    const verbs=row.querySelector(".a-verbs").value.split(",").map(v=>v.trim()).filter(Boolean);
    const targets=row.querySelector(".a-targets").value.split(",").map(v=>v.trim()).filter(Boolean);
    const reqStr=row.querySelector(".a-req").value.trim();
    const ok=row.querySelector(".a-ok").value.trim();
    const fail=row.querySelector(".a-fail").value.trim();
    const fxStr=row.querySelector(".a-fx").value.trim();
    if(!verbs.length) return;
    const act={ id:id2, verbs, targets, successText:ok, failText:fail };
    if(reqStr) try{ act.requires=JSON.parse(reqStr); }catch{}
    if(fxStr)  try{ act.effects=JSON.parse(fxStr); }catch{}
    r.actions.push(act);
  });

  // Hazards
  r.hazards=[];
  document.querySelectorAll("#hazardsList .list-item").forEach(row=>{
    const h={
      type:   row.querySelector(".h-type").value,
      counter:row.querySelector(".h-counter").value.trim()||undefined,
      deathText:row.querySelector(".h-death").value.trim(),
    };
    const safeStr=row.querySelector(".h-safe").value.trim();
    const warnStr=row.querySelector(".h-warn").value.trim();
    const thresh=parseInt(row.querySelector(".h-thresh").value)||0;
    if(safeStr) try{ h.safeIf=JSON.parse(safeStr); }catch{}
    if(warnStr) try{ h.warningStages=JSON.parse(warnStr); }catch{}
    if(h.type==="visitCount") h.safeUnder=thresh;
    else if(h.type==="commandPressure") h.threshold=thresh;
    r.hazards.push(h);
  });

  // Objects
  r.objects={};
  document.querySelectorAll("#objectsList .list-item").forEach(row=>{
    const id2=row.querySelector(".o-id").value.trim();
    if(!id2) return;
    r.objects[id2]={ id:id2, aliases:row.querySelector(".o-aliases").value.split(",").map(v=>v.trim()).filter(Boolean), examineText:row.querySelector(".o-examine").value, useText:row.querySelector(".o-use").value };
  });

  // Flavour targets
  r.flavourTargets={};
  document.querySelectorAll("#flavourList .list-item").forEach(row=>{
    const id2=row.querySelector(".o-id").value.trim();
    if(!id2) return;
    const obj={ id:id2, aliases:row.querySelector(".o-aliases").value.split(",").map(v=>v.trim()).filter(Boolean), examineText:row.querySelector(".o-examine").value, useText:row.querySelector(".o-use").value };
    const readEl=row.querySelector(".o-read");
    const touchEl=row.querySelector(".o-touch");
    const smellEl=row.querySelector(".o-smell");
    if(readEl?.value)  obj.readText=readEl.value;
    if(touchEl?.value) obj.touchText=touchEl.value;
    if(smellEl?.value) obj.smellText=smellEl.value;
    r.flavourTargets[id2]=obj;
  });

  // Rename room if id changed
  if(newId!==oldId){
    STATE.rooms[newId]=r;
    delete STATE.rooms[oldId];
    STATE.currentRoom=newId;
  }

  refreshAll();
  showRoom(newId);
  toast("Room saved");
}

// ── Item editor ───────────────────────────────────────────────────
function showItem(id){
  STATE.currentItem=id;
  STATE.currentView="item";
  setActiveNav(`[data-item-id="${id}"]`);
  const it=STATE.items[id];

  const VERBS=["look","hold","wear","use","read","open","swing","attack","cut","force","inject","touch","smell","listen","drop"];

  el("mainArea").innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <h2 style="font-size:16px">${it.name||id} <span style="font-size:12px;color:var(--muted);font-family:var(--mono)">${id}</span></h2>
    <button class="btn danger sm" id="deleteItem">Delete Item</button>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Item Details</h2></div>
    <div class="panel-body grid2">
      <div class="field"><label>Item ID</label><input id="itId" value="${id}"></div>
      <div class="field"><label>Name</label><input id="itName" value="${it.name||""}"></div>
      <div class="field"><label>Icon key</label><input id="itIcon" value="${it.icon||""}"></div>
      <div class="field"><label>Description</label><input id="itDesc" value="${it.description||""}"></div>
      <div class="field full"><label>Aliases</label><input id="itAliases" value="${(it.aliases||[]).join(", ")}"></div>
      <div class="field full"><label>Tags</label><div id="itTagsWrap"></div></div>
      <div class="checkbox-row"><input type="checkbox" id="itCarry" ${it.canCarry?"checked":""}><label for="itCarry">canCarry</label></div>
      <div class="checkbox-row"><input type="checkbox" id="itHold" ${it.canHold?"checked":""}><label for="itHold">canHold</label></div>
      <div class="checkbox-row"><input type="checkbox" id="itWear" ${it.canWear?"checked":""}><label for="itWear">canWear</label></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Item Texts</h2></div>
    <div class="panel-body grid2">
      <div class="field"><label>Pickup text</label><input id="itPickup" value="${esc(it.pickupText||"")}"></div>
      <div class="field"><label>Drop text</label><input id="itDrop" value="${esc(it.dropText||"")}"></div>
      <div class="field"><label>Held text</label><input id="itHeld" value="${esc(it.heldText||"")}"></div>
      <div class="field"><label>Worn text</label><input id="itWorn" value="${esc(it.wornText||"")}"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Default Actions</h2></div>
    <div class="panel-body">
      ${VERBS.map(v=>`<div class="field" style="margin-bottom:8px">
        <label>${v}</label>
        <input class="da-inp" data-verb="${v}" value="${esc(it.defaultActions?.[v]||"")}">
      </div>`).join("")}
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:60px">
    <button class="btn primary" id="saveItem">Save Item</button>
  </div>`;

  // Tags widget
  const tags=[...(it.tags||[])];
  const tagWrap=el("itTagsWrap");
  tagWrap.appendChild(makeTagInput(tags, updated=>{ it.tags=[...updated]; }));

  el("deleteItem").onclick=()=>{
    if(!confirm(`Delete item "${id}"?`)) return;
    delete STATE.items[id];
    refreshAll();
    el("mainArea").innerHTML=`<div class="empty-state"><p>Item deleted.</p></div>`;
    toast("Item deleted","warn");
  };

  el("saveItem").onclick=()=>{
    const newId=el("itId").value.trim()||id;
    it.name        = el("itName").value.trim();
    it.icon        = el("itIcon").value.trim();
    it.description = el("itDesc").value.trim();
    it.aliases     = el("itAliases").value.split(",").map(v=>v.trim()).filter(Boolean);
    it.canCarry    = el("itCarry").checked;
    it.canHold     = el("itHold").checked;
    it.canWear     = el("itWear").checked;
    it.pickupText  = el("itPickup").value;
    it.dropText    = el("itDrop").value;
    it.heldText    = el("itHeld").value;
    it.wornText    = el("itWorn").value;
    it.defaultActions={};
    document.querySelectorAll(".da-inp").forEach(inp=>{
      if(inp.value.trim()) it.defaultActions[inp.dataset.verb]=inp.value.trim();
    });
    if(newId!==id){
      STATE.items[newId]=it;
      delete STATE.items[id];
      STATE.currentItem=newId;
    }
    refreshAll();
    showItem(newId);
    toast("Item saved");
  };
}

// ══════════════════════════════════════════════════════════════════
// ADD ROOM / ITEM
// ══════════════════════════════════════════════════════════════════

function addRoom(){
  const id=prompt("Room ID (e.g. hallway):");
  if(!id||STATE.rooms[id]) return;
  STATE.rooms[id]={ title:id, gridPosition:{col:0,row:0}, media:id, fx:null, baseDescription:"", itemText:{}, exits:{}, states:{}, hazards:[], actions:[], enterRules:[], objects:{}, flavourTargets:{} };
  refreshAll();
  showRoom(id);
  toast("Room created");
}

function addItem(){
  const id=prompt("Item ID (e.g. lantern):");
  if(!id||STATE.items[id]) return;
  STATE.items[id]={ name:id, icon:id, aliases:[id], description:"", tags:[], canCarry:true, canHold:false, canWear:false, pickupText:"", dropText:"", defaultActions:{} };
  refreshAll();
  showItem(id);
  toast("Item created");
}

// ══════════════════════════════════════════════════════════════════
// EXPORT
// ══════════════════════════════════════════════════════════════════

function exportFiles(){
  const gameJs = `// data/game.js\n"use strict";\nexport const GAME = ${JSON.stringify(STATE.game,null,2)};\n`;
  const roomsJs= `// data/rooms.js\n"use strict";\nexport const ROOMS = ${JSON.stringify(STATE.rooms,null,2)};\n`;
  const itemsJs= `// data/items.js\n"use strict";\nexport const ITEMS = ${JSON.stringify(STATE.items,null,2)};\n`;

  [["game.js",gameJs],["rooms.js",roomsJs],["items.js",itemsJs]].forEach(([name,content])=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([content],{type:"text/javascript"}));
    a.download=name;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  toast("3 files exported");
}

// ══════════════════════════════════════════════════════════════════
// LOAD from JS (paste/eval approach)
// ══════════════════════════════════════════════════════════════════

function promptLoad(){
  const info=`Paste your game.js, rooms.js, or items.js content below.\n\nThe editor will extract the exported const.`;
  const code=prompt(info);
  if(!code) return;
  try{
    // Extract object from export const XXX = { ... }
    const match=code.match(/export\s+const\s+\w+\s*=\s*([\s\S]+)/);
    if(!match) throw new Error("Could not find export const");
    const obj=Function('"use strict";return ('+match[1].replace(/;?\s*$/,"")+");")();
    // Detect type
    if(obj.startRoom!==undefined){ STATE.game=obj; toast("game.js loaded"); }
    else if(Object.values(obj)[0]?.exits!==undefined){ Object.assign(STATE.rooms,obj); toast("rooms.js loaded"); }
    else if(Object.values(obj)[0]?.canCarry!==undefined){ Object.assign(STATE.items,obj); toast("items.js loaded"); }
    else throw new Error("Unknown file type");
    refreshAll();
  } catch(e){ toast("Load failed: "+e.message,"err"); }
}

// ══════════════════════════════════════════════════════════════════
// WIRE EVENTS
// ══════════════════════════════════════════════════════════════════

function esc(s){ return String(s??""").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("[data-view]").forEach(item=>{
    item.onclick=()=>{
      if(item.dataset.view==="game") showGame();
      if(item.dataset.view==="map")  showMap();
    };
  });
  el("btnAddRoom").onclick=addRoom;
  el("btnAddItem").onclick=addItem;
  el("btnExport").onclick=exportFiles;
  el("btnLoad").onclick=promptLoad;
  el("btnLoadTemplate").onclick=loadWardBTemplate;
});
